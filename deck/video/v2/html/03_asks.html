<!doctype html><html><head><meta charset="utf-8"><title>03 asks</title>
<link rel="stylesheet" href="assets/shared.css">
<style>
.ask{position:absolute;left:180px;width:1560px;height:150px;padding:0 56px;display:flex;align-items:center;white-space:nowrap;transform-origin:50% 50%;will-change:transform;font-weight:500;font-size:40px;line-height:1.1;letter-spacing:-0.02em;color:var(--ink)}
.ask .n{font-family:var(--mono);font-size:20px;color:var(--mute);letter-spacing:.06em;margin-right:36px;flex:none}
.p{position:absolute;bottom:96px;width:62px;height:72px}
.p i{position:absolute;top:22px;width:9px;height:20px;border-radius:5px;background:var(--card)}
.p i:first-child{left:20px}.p i:last-child{left:33px}
</style></head><body><div id="stage">
<div class="ask card" id="a0"><span class="n">01</span>Who is the best person to mentor this year’s interns?</div>
<div class="ask card" id="a1"><span class="n">02</span>Who is the best person to lead a pricing task force with the US partner?</div>
<div class="ask card" id="a2"><span class="n">03</span>Who is the best person for the two-year exchange?</div>
<div class="p blob" style="left:300px"><i></i><i></i></div>
<div class="p blob" style="left:929px"><i></i><i></i></div>
<div class="p blob" style="left:1560px"><i></i><i></i></div>
</div>
<script src="assets/shared.js"></script><script>
const {seg,lerp,clamp}=PIK;
const T=[400,2300,4200], Y=[250,372,494], R=[-1.1,0.7,-0.4];
function seek(ms){
  T.forEach((t,i)=>{ const a=document.getElementById('a'+i); const p=seg(ms,t,300);
    // cards below the new one get nudged down by its landing
    let nudge=0; for(let j=i+1;j<3;j++){ const u=clamp((ms-T[j]-220)/240); nudge+=Math.sin(u*Math.PI)*7; }
    a.style.top=Y[i]+'px'; a.style.opacity=p>0?1:0; a.style.zIndex=i;
    a.style.transform=`translateY(${nudge.toFixed(1)}px) scale(${lerp(1.2,1,p).toFixed(3)}) rotate(${R[i]}deg)`; a.style.opacity=clamp(p*3).toFixed(3); });
  // the blobs look up when a card lands
  const look=T.reduce((m,t)=>{const u=clamp((ms-t-150)/900); return m+Math.sin(u*Math.PI)*6;},0);
  document.querySelectorAll('.p i').forEach(e=>e.style.transform=`translateY(${(-look).toFixed(1)}px)`);
  const pp=seg(ms,0,500); document.querySelectorAll('.p').forEach(e=>{e.style.opacity=pp; e.style.transform=`translateY(${lerp(20,0,pp).toFixed(1)}px)`});
}
PIK.init(seek,7000);
</script></body></html>
