<!doctype html><html><head><meta charset="utf-8"><title>04 meet pik</title>
<link rel="stylesheet" href="assets/shared.css">
<style>
#bot{position:absolute;left:430px;top:340px;width:300px;height:390px;will-change:transform}
#txt{position:absolute;left:840px;top:392px}
.line{overflow:hidden;padding-bottom:.08em}
.line .in{display:inline-block;font-weight:600;font-size:124px;line-height:1;letter-spacing:-0.04em;color:var(--ink)}
#tag{margin-top:26px;font-weight:400;font-size:40px;line-height:1.3;letter-spacing:-0.012em;color:var(--ink)}
#tag div{overflow:hidden;padding-bottom:.18em;margin-bottom:-.18em}
#tag span{display:inline-block}
</style></head><body><div id="stage">
<div id="bot"></div>
<div id="txt"><div class="line"><div class="in">Meet Pik.</div></div>
<div id="tag"><div><span>It knows who’s done what,</span></div><div><span>and answers where you ask.</span></div></div></div>
<div class="grain"></div></div>
<script src="assets/shared.js"></script><script>
const {seg,lerp,easeInOut}=PIK;
const svg=PIK.pikbot(document.getElementById('bot'),300);
function seek(ms){
  const p=seg(ms,0,700); document.getElementById('bot').style.transform=`translateX(${lerp(-760,0,p).toFixed(1)}px)`;
  PIK.spring(svg,ms,620,1000,24); PIK.blink(svg,ms,1500); PIK.blink(svg,ms,3100);
  // eyes glance toward the words after landing
  const g=seg(ms,1100,400,easeInOut); const eyes=svg.querySelector('.pk-eyes'); const cur=eyes.style.transform||'';
  eyes.style.transform=cur.replace(/translate\([^)]*\)\s*/,'')+` translate(${(g*6).toFixed(1)}px,0)`;
  const h=seg(ms,760,620); document.querySelector('#txt .in').style.transform=`translateY(${lerp(110,0,h).toFixed(1)}%)`;
  document.querySelectorAll('#tag span').forEach((s,i)=>{ const q=seg(ms,1350+i*100,560); s.style.transform=`translateY(${lerp(110,0,q).toFixed(1)}%)`; s.style.opacity=q; });
}
PIK.init(seek,4200);
</script></body></html>
