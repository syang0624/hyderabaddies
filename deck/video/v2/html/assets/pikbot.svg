<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260">
  <!-- Pikbot: the screen's mark (prototype/ui/index.html #pikmark) at video size: ink body, a short antenna curling up and
       to the right, two lime eyes. Same 200x260 box and antenna root (96,82) as before so the beats' antenna arcs still fit.
       Ids are stable so a beat can animate parts: #antenna, #body, #eyes, #eyeL, #eyeR. -->
  <g id="pikbot">
    <path id="antenna" d="M96 84 C 96 46, 134 46, 134 72" fill="none" stroke="#171717" stroke-width="14" stroke-linecap="round"/>
    <ellipse id="body" cx="100" cy="166" rx="70" ry="78" fill="#171717"/>
    <g id="eyes" fill="#D6F25A">
      <rect id="eyeL" x="74" y="140" width="17" height="39" rx="8.5"/>
      <rect id="eyeR" x="109" y="140" width="17" height="39" rx="8.5"/>
    </g>
  </g>
</svg>
