<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260">
  <!-- Pikbot: black rounded body (wider at the bottom), a spring antenna off the top-left, two white pill eyes.
       Ids are stable so a beat can animate parts: #antenna, #body, #eyes, #eyeL, #eyeR. -->
  <g id="pikbot">
    <path id="antenna" d="M96 78 C 72 64, 66 30, 88 18 C 106 8, 124 26, 114 44" fill="none" stroke="#111111" stroke-width="13" stroke-linecap="round"/>
    <path id="body" d="M100 68 C 142 68, 168 120, 168 178 C 168 228, 138 254, 100 254 C 62 254, 32 228, 32 178 C 32 120, 58 68, 100 68 Z" fill="#111111"/>
    <g id="eyes" fill="#FFFFFF">
      <rect id="eyeL" x="82" y="102" width="13" height="30" rx="6.5"/>
      <rect id="eyeR" x="105" y="102" width="13" height="30" rx="6.5"/>
    </g>
  </g>
</svg>
