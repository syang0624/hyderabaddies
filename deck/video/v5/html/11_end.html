<!doctype html><html><head><meta charset="utf-8"><title>11 end (v5: headline + credit only)</title>
<link rel="stylesheet" href="../../v2/html/assets/shared.css">
<style>
#head{position:absolute;left:160px;top:330px}
.line{overflow:hidden;padding-bottom:.08em}
.line .in{display:inline-block;font-weight:600;font-size:96px;line-height:1.02;letter-spacing:-0.035em;color:var(--ink)}
#sm{position:absolute;left:164px;top:580px;font-family:var(--mono);font-size:24px;letter-spacing:.01em;color:var(--mute);opacity:0}
#credit{position:absolute;left:164px;top:1010px;font-family:var(--mono);font-size:17px;letter-spacing:.01em;color:var(--mute);opacity:0}
#bot{position:absolute;left:1560px;top:610px;width:200px;height:260px;will-change:transform}
</style></head><body><div id="stage">
<div id="head"><div class="line"><div class="in">Because the future of your work</div></div>
<div class="line"><div class="in">depends on who you <span class="hl">Pik</span>.</div></div></div>
<div id="credit">Music: Kosmose Vaikus by Kevin MacLeod, incompetech.com, CC BY 4.0</div>
<div id="bot"></div>
</div>
<script src="../../v2/html/assets/shared.js"></script><script>
const {seg,lerp}=PIK;
const svg=PIK.pikbot(document.getElementById('bot'),200,{disc:true});
function seek(ms){
  document.querySelectorAll('#head .in').forEach((el,i)=>{ const p=seg(ms,300+i*90,640); el.style.transform=`translateY(${lerp(130,0,p).toFixed(1)}%)`; });
  document.getElementById('credit').style.opacity=(0.85*seg(ms,2000,500)).toFixed(3);
  const b=seg(ms,900,600); const bot=document.getElementById('bot'); bot.style.opacity=b; bot.style.transform=`translateY(${lerp(40,0,b).toFixed(1)}px)`;
  PIK.spring(svg,ms,1450,900,18); PIK.blink(svg,ms,2600); PIK.blink(svg,ms,4100);
}
PIK.init(seek,5000);
</script></body></html>
