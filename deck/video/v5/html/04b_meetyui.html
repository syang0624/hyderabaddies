<!doctype html><html><head><meta charset="utf-8"><title>04b meet yui (v5)</title>
<link rel="stylesheet" href="../../v2/html/assets/shared.css">
<style>
#disc{position:absolute;left:400px;top:365px;width:350px;height:350px;border-radius:50%;background:var(--lime-tint);opacity:0;display:flex;align-items:center;justify-content:center}
#yui{width:150px;height:172px;position:relative}
#yui i{position:absolute;top:56px;width:15px;height:35px;border-radius:8px;background:var(--card)}
#yui i:first-child{left:55px}#yui i:last-child{left:80px}
#txt{position:absolute;left:840px;top:378px}
.line{overflow:hidden;padding-bottom:.08em}
.line .in{display:inline-block;font-weight:600;font-size:124px;line-height:1;letter-spacing:-0.04em;color:var(--ink)}
#role{margin-top:14px;font-size:36px;color:var(--mute);letter-spacing:-0.01em;opacity:0}
#l2{margin-top:40px;font-size:42px;line-height:1.3;letter-spacing:-0.012em;color:var(--body);opacity:0}
#l3{margin-top:16px;font-family:var(--mono);font-size:26px;letter-spacing:.02em;color:var(--mute);opacity:0}
</style></head><body><div id="stage">
<div id="disc"><div id="yui" class="blob"><i></i><i></i></div></div>
<div id="txt"><div class="line"><div class="in">Meet Yui.</div></div><div id="role">Product operations, Pricing</div>
<div id="l2">Pik lives where she works.</div><div id="l3">her Slack · her email</div></div>
</div>
<script src="../../v2/html/assets/shared.js"></script><script>
const {seg,lerp,easeInOut,clamp}=PIK;
function seek(ms){
  const d=seg(ms,0,600); const disc=document.getElementById('disc'); disc.style.opacity=d; disc.style.transform=`scale(${lerp(.86,1,d).toFixed(3)})`;
  const h=seg(ms,250,600); document.querySelector('#txt .in').style.transform=`translateY(${lerp(110,0,h).toFixed(1)}%)`;
  const r=seg(ms,650,450); const role=document.getElementById('role'); role.style.opacity=r; role.style.transform=`translateY(${lerp(10,0,r).toFixed(1)}px)`;
  const l2=seg(ms,1900,500); const e2=document.getElementById('l2'); e2.style.opacity=l2; e2.style.transform=`translateY(${lerp(14,0,l2).toFixed(1)}px)`;
  const l3=seg(ms,2600,450); const e3=document.getElementById('l3'); e3.style.opacity=l3; e3.style.transform=`translateY(${lerp(10,0,l3).toFixed(1)}px)`;
  let b=1; for(const at of [1400,3000]){ const t=clamp((ms-at)/180); if(t>0&&t<1) b=0.08+0.92*Math.abs(t*2-1); }
  document.querySelectorAll('#yui i').forEach(i=>i.style.transform=`scaleY(${b.toFixed(3)})`);
}
PIK.init(seek,3600);
</script></body></html>
