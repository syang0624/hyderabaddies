<!doctype html><html><head><meta charset="utf-8"><title>02 asked (v5)</title>
<link rel="stylesheet" href="../../v2/html/assets/shared.css">
<style>
#ask{position:absolute;left:0;right:0;top:390px;text-align:center}
#ask .eb{font-family:var(--mono);font-size:30px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);opacity:0}
.line{overflow:hidden;padding-bottom:.1em}
.line .in{display:inline-block}
#wm{font-weight:600;font-size:112px;line-height:1.05;letter-spacing:.05em;color:var(--ink);margin-top:14px}
#team{position:absolute;left:0;right:0;top:0;height:1080px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:136px;letter-spacing:-0.035em;color:var(--ink);opacity:0;transform-origin:50% 50%;pointer-events:none}
.qcard{position:absolute;top:360px;width:500px;height:420px;padding:44px 44px 40px;display:flex;flex-direction:column;justify-content:space-between;transform-origin:50% 50%;will-change:transform;opacity:0}
.qcard .mark{font-weight:600;font-size:72px;line-height:.6;color:var(--ink);height:34px}
.qcard .q{font-weight:400;font-size:33px;line-height:1.3;letter-spacing:-0.012em;color:var(--ink);flex:1;margin-top:18px}
.qcard .who{font-family:var(--mono);font-size:19px;letter-spacing:.02em;color:var(--mute)}
#head{position:absolute;left:0;right:0;top:790px;text-align:center}
#head .in{font-weight:600;font-size:96px;line-height:1.04;letter-spacing:-0.03em;color:var(--ink)}
</style></head><body><div id="stage">
<div id="ask"><div class="eb" id="eb">We asked people at</div><div class="line"><div class="in" id="wm">RECRUIT HOLDINGS</div></div></div>
<div id="team">Team formation.</div>
<div class="qcard card" id="c0" style="left:160px"><div class="mark">“</div><div class="q"></div><div class="who">a head of HR</div></div>
<div class="qcard card" id="c1" style="left:710px"><div class="mark">“</div><div class="q"></div><div class="who">a product leader who manages 40</div></div>
<div class="qcard card" id="c2" style="left:1260px"><div class="mark">“</div><div class="q"></div><div class="who">a former engineering leader of 150</div></div>
<div id="head"><div class="line"><div class="in">Decided from memory.</div></div></div>
</div>
<script src="../../v2/html/assets/shared.js"></script><script>
const {seg,lerp,easeInOut,easeIn,typed,clamp}=PIK;
const Q=["Team formation, as AI dissolves the roles. That is what we're most troubled by.",
         "Every cycle I build my own deck of everything my boss didn't see.",
         "Managers pitch people from memory. Four or five days a quarter."];
const T=[3700,3820,3940], TT=[3950,4550,5150], CPS=60;  // V6: cards arrive together, soft (fade, 24 px rise, 0.98 -> 1, 700 ms ease-out, 120 ms stagger); typing stays staggered
function seek(ms){
  // 1) "We asked people at RECRUIT HOLDINGS" (typography only), then it leaves upward
  const w=seg(ms,250,600), out=seg(ms,2050,300,easeIn);
  document.getElementById('eb').style.opacity=(seg(ms,100,400)*(1-out)).toFixed(3);
  const wm=document.getElementById('wm'); wm.style.transform=`translateY(${lerp(110,0,w)-130*out}%)`; wm.style.opacity=(1-out).toFixed(3);
  // 2) "Team formation." pops alone, big, then rises and shrinks to the top while the cards come in
  const tp=seg(ms,2500,380), tsm=seg(ms,3400,500,easeInOut);
  const team=document.getElementById('team'); team.style.opacity=clamp(tp*3).toFixed(3);
  team.style.transform=`translateY(${(-380*tsm).toFixed(1)}px) scale(${lerp(lerp(1.18,1,tp),0.42,tsm).toFixed(3)})`;
  // 3) three quote cards, typed
  const st=seg(ms,6300,600,easeInOut);
  Q.forEach((q,i)=>{ const c=document.getElementById('c'+i); const p=seg(ms,T[i],700);
    const shown=typed(q,ms,TT[i],CPS); const qe=c.querySelector('.q'); if(qe.textContent!==shown) qe.textContent=shown;
    const done=shown.length>=q.length; c.querySelector('.who').style.opacity=done?seg(ms,TT[i]+q.length/CPS*1000,250):0;
    const x0=[160,710,1260][i], x1=710+[-14,0,14][i], y1=[-134,-140,-146][i], rot=[-4,0,4][i]*st;
    c.style.left=lerp(x0,x1,st).toFixed(1)+'px';
    c.style.transform=`translateY(${lerp(lerp(24,0,p),y1,st).toFixed(1)}px) scale(${lerp(lerp(.98,1,p),.72,st).toFixed(3)}) rotate(${rot.toFixed(2)}deg)`;
    c.style.opacity=p.toFixed(3); c.style.zIndex=i; });
  // 4) "Decided from memory." lands with the narrator
  const h=seg(ms,6450,560); document.querySelector('#head .in').style.transform=`translateY(${lerp(120,0,h).toFixed(1)}%)`;
  team.style.opacity=(clamp(tp*3)*(1-seg(ms,6300,400))).toFixed(3);
}
PIK.init(seek,7400);
</script></body></html>
