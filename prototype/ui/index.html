<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pik</title>
<style>
  @font-face{font-family:Geist;src:url(/fonts/geist.woff2) format('woff2-variations');font-weight:100 900;font-display:swap}
  @font-face{font-family:"Geist Mono";src:url(/fonts/geist-mono.woff2) format('woff2-variations');font-weight:100 900;font-display:swap}
  :root{
    --paper:#0A0A0A;--paper2:#161616;--receipt:#111111;--ink:#EDEDED;--body:#A1A1A1;--mute:#7A7A7A;--rule:#2A2A2A;
    --teal:#EDEDED;--teal-soft:#262626;--amber:#EDEDED;--amber-ink:#0A0A0A;--coral:#FF6166;
    --shape-a:#EDEDED;--shape-b:#8A8A8A;--shape-c:#4A4A4A;
    --sans:Geist,Inter,system-ui,-apple-system,sans-serif;--mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --shadow:0 0 0 1px #ffffff12,0 1px 1px #00000060,0 8px 24px -14px #00000080;
    --emerald:#7BD389;
    --s:1;--strip:160px;
  }
  @property --b3{syntax:'<length>';inherits:true;initial-value:216px}
  *{box-sizing:border-box}
  html{background:var(--paper);height:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font:15px/22px var(--sans);letter-spacing:-.2px;-webkit-font-smoothing:antialiased;--b3:216px;transition:--b3 .3s ease;min-height:100%}
  body.present{--b3:232px}
  body.nob3{--b3:0px}
  body.present{--s:1.15;--strip:236px;font-size:17px;line-height:25px;overflow:hidden;width:1920px;height:1080px}
  ::selection{background:var(--ink);color:var(--paper)}
  h1,h2,h3,p{margin:0}
  button{font:inherit;color:inherit;letter-spacing:inherit}
  .eyebrow{font:500 calc(11px*var(--s))/16px var(--mono);letter-spacing:.5px;text-transform:uppercase;color:var(--mute)}
  .mono{font-family:var(--mono)}
  .na{color:var(--coral);font:500 11px/14px var(--mono)}
  .coral{color:var(--coral)}
  .em{color:var(--emerald)}

  #app{display:grid;grid-template-rows:56px 128px var(--b3) minmax(0,1fr) var(--strip);height:100vh;min-height:720px}
  body.present #app{height:1080px}
  #app>*{min-height:0}

  /* B1 header */
  #b1{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 32px;border-bottom:1px solid var(--rule);gap:24px}
  #b1 .left{display:flex;align-items:center;gap:12px}
  #b1 .mark{width:26px;height:26px;display:block}
  #b1 .brandname{font-weight:700;letter-spacing:-.5px;font-size:17px}
  #b1 .status{font:500 calc(12px*var(--s))/16px var(--mono);letter-spacing:.5px;text-transform:uppercase;color:var(--mute);padding-left:12px;border-left:1px solid var(--rule)}
  #b1 .status.on{color:var(--ink)}
  #b1 .centre{text-align:center;color:var(--body);font-size:calc(13px*var(--s));line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:820px}
  #b1 .centre b{color:var(--ink);font-weight:600}
  #b1 .right{display:flex;justify-content:flex-end;align-items:center;gap:12px;font:calc(12px*var(--s))/16px var(--mono);color:var(--mute);white-space:nowrap}
  #b1 .right .never{color:var(--coral)}
  .badge{display:inline-block;font:500 calc(11px*var(--s))/16px var(--mono);letter-spacing:.4px;text-transform:uppercase;color:var(--ink);border:1px solid var(--rule);border-radius:4px;padding:0 7px;white-space:nowrap}
  .badge.soft{color:var(--mute)}
  .badge.em{color:var(--emerald);border-color:var(--emerald)}

  /* B2 conversation */
  #b2{display:grid;grid-template-columns:64px minmax(0,1fr);gap:20px;align-items:center;padding:0 32px;border-bottom:1px solid var(--rule)}
  #mascot{width:64px;height:64px;display:block;overflow:visible}
  #mascot .ant{transition:transform .4s ease;transform-origin:32px 18px}
  #mascot.listening .ant{transform:translateY(-4px)}
  #mascot .mouth{transform-origin:32px 46px;transition:transform .15s}
  #mascot.talk .mouth{transform:scaleY(3.2)}
  #conv{display:flex;flex-direction:column;gap:8px;min-width:0}
  .question .eyebrow{display:block;margin-bottom:2px}
  .question .qt{font-size:calc(26px*var(--s));line-height:1.12;font-weight:600;letter-spacing:-.9px;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  #conv.hasask .question .qt{-webkit-line-clamp:1}
  .chips{display:flex;gap:8px;flex-wrap:wrap;min-height:0}
  .chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--ink);border-radius:999px;padding:3px 12px;font:500 calc(13px*var(--s))/18px var(--mono);color:var(--ink);background:var(--paper);white-space:nowrap}
  .chip.soft{border-color:var(--rule);color:var(--body)}
  .askbar{display:flex;align-items:center;gap:14px;background:var(--ink);color:#0A0A0A;border-radius:14px;padding:8px 16px;font-size:calc(17px*var(--s));line-height:1.3;font-weight:600;letter-spacing:-.4px}
  .askbar .spk{display:flex;align-items:center;gap:6px;font:600 10px/12px var(--mono);letter-spacing:.6px;text-transform:uppercase;opacity:.75;white-space:nowrap}
  .askbar .spk svg{width:18px;height:18px}
  .askbar .act{margin-left:auto}
  .inrow{display:flex;gap:10px;align-items:center;background:var(--receipt);border:1.5px solid var(--rule);border-radius:14px;padding:4px 4px 4px 16px;box-shadow:var(--shadow);max-width:1100px}
  .inrow:focus-within{border-color:var(--ink)}
  .inrow input{flex:1;border:0;background:transparent;font:17px/24px var(--sans);letter-spacing:-.2px;color:var(--ink);outline:none;min-width:0}
  .inrow input::placeholder{color:var(--mute)}
  .act{border:0;border-radius:10px;padding:8px 14px;font:600 calc(13px*var(--s))/18px var(--sans);letter-spacing:-.2px;cursor:pointer;background:var(--ink);color:#0A0A0A;white-space:nowrap}
  .act.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--rule)}
  .act.coral{background:transparent;color:var(--coral);border:1.5px solid var(--coral)}
  .banner{background:var(--ink);color:#0A0A0A;padding:12px 18px;border-radius:14px;font-size:calc(16px*var(--s));line-height:1.35;max-width:1100px}
  .banner b{font-weight:700}
  body.present:not(.admin) .inrow{display:none}
  body.present .dev{display:none!important}

  /* B3 people */
  #b3{position:relative;padding:8px 32px 10px;border-bottom:1px solid var(--rule);overflow:hidden}
  body.nob3 #b3{border-bottom-width:0;padding:0 32px}
  #b3 .hdr{display:flex;justify-content:space-between;align-items:center;height:18px;margin-bottom:6px}
  .tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;height:188px} /* present: B3 232 = 8 + 18 + 6 + 188 + 12; the tile at x1.15 type is 186 tall */
  body:not(.present) .tiles{height:auto}
  .tile{position:relative;display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:start;background:var(--receipt);border:1.5px solid var(--rule);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);transition:opacity .4s,border-color .3s,box-shadow .3s;cursor:pointer;text-align:left;min-width:0}
  .tile .av{width:72px;height:72px;display:block}
  .tile .nm{font-size:calc(22px*var(--s));line-height:26px;font-weight:700;letter-spacing:-.7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tile .meta{font:calc(12px*var(--s))/16px var(--mono);color:var(--mute);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tile .why{font-size:calc(13px*var(--s));line-height:18px;color:var(--body);margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:17px}
  .tile .row{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:nowrap;overflow:hidden;min-height:18px}
  .tile .bar{height:4px;background:var(--rule);border-radius:2px;margin-top:8px;overflow:hidden}
  .tile .bar i{display:block;height:100%;width:0;background:var(--ink);transition:width .6s ease}
  .tile .num{margin-top:5px;font:600 calc(12px*var(--s))/16px var(--mono);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tile .num button{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
  .tile .copy{font-size:calc(13px*var(--s));line-height:16px;color:var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tile.back{opacity:.5}
  .tile.dim{opacity:.4}
  .tile.focus{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink),var(--shadow)}
  .tile.emring{border-color:var(--emerald);box-shadow:0 0 0 2px var(--emerald),var(--shadow)}
  .tile .reason{display:inline-flex;font:500 calc(11px*var(--s))/16px var(--mono);color:var(--ink);border:1px solid var(--rule);border-radius:4px;padding:0 6px}
  .tile.draft{cursor:default;border-style:dashed}
  .tile.draft .copy{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .tile .btns{display:flex;gap:8px;margin-top:8px;align-items:center}
  .tile .btns .act{padding:5px 12px}
  .fn{display:inline-flex;align-items:center;gap:5px;font:calc(12px*var(--s))/16px var(--mono);letter-spacing:0;color:var(--body);background:var(--paper);border:1px solid var(--rule);border-radius:5px;padding:1px 7px;cursor:pointer;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .fn svg{width:11px;height:11px;flex:none}
  .fn:hover,.fn.open,.fn.pin{border-color:var(--ink);color:var(--ink)}
  .fn.em{border-color:var(--emerald);color:var(--emerald)}
  .fn.miss{color:var(--mute);border-style:dashed;cursor:default}
  .stamp{display:inline-flex;align-items:center;font:600 calc(11px*var(--s))/14px var(--mono);letter-spacing:.5px;text-transform:uppercase;color:var(--ink);border:1.5px solid var(--ink);border-radius:4px;padding:1px 6px;transform:rotate(-2deg);white-space:nowrap}
  .stamp.grey{color:var(--mute);border-color:var(--mute)}
  .stamp.em{color:var(--emerald);border-color:var(--emerald)}

  /* conclusion card over B3 */
  #concl{position:absolute;left:32px;right:32px;top:8px;z-index:6;background:var(--receipt);border:1.5px solid var(--ink);border-radius:14px;padding:16px 20px;box-shadow:0 30px 60px -20px #000000CC,var(--shadow);display:none;grid-template-columns:1.2fr 1fr;gap:10px 28px}
  #concl.on{display:grid;animation:settle .4s ease-out both}
  @keyframes settle{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  #concl .sum{font-size:calc(17px*var(--s));line-height:1.35;color:var(--ink);margin-top:4px}
  #concl .who{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  #concl .who span{padding:3px 12px;border-radius:999px;border:1.5px solid var(--ink);font:600 13px/18px var(--sans)}
  #concl ul{margin:4px 0 0;padding-left:16px;font-size:calc(13px*var(--s));line-height:1.35;color:var(--body)}
  #concl .foot{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px dashed var(--rule);padding-top:10px;margin-top:2px}
  #concl .foot .filed{font:calc(12px*var(--s))/16px var(--mono);color:var(--mute)}
  #concl .foot .filed.on{color:var(--ink)}

  /* B4 */
  #b4{display:grid;grid-template-columns:58% 42%;min-height:0}
  #graph{position:relative;overflow:hidden;min-width:0}
  #graph svg{display:block;width:100%;height:100%}
  #graph .edge{stroke:var(--rule);stroke-opacity:.35;fill:none;transition:opacity .35s}
  #graph .node{transition:opacity .35s}
  #graph .node circle{fill:var(--shape-b);stroke:var(--shape-b);stroke-width:1.2}
  #graph .node.fx circle{fill:var(--ink);stroke:var(--ink)}
  #graph .node.cap circle{stroke-dasharray:2 2;fill-opacity:.55}
  #graph .node.leave circle,#graph .node.hollow circle{fill:none}
  #graph .node.hollow circle{stroke:var(--ink);stroke-width:1.6}
  #graph .node.leave circle{stroke-dasharray:1.5 2.2}
  #graph .node .ring{fill:none;stroke:var(--ink);stroke-width:1.5;opacity:0;transition:opacity .3s,stroke .6s}
  #graph .node.lit .ring{opacity:1}
  #graph .node.lit.emr .ring{stroke:var(--emerald)}
  #graph .node.con{opacity:.3!important}
  #graph .hub rect{fill:var(--mute);transition:fill .35s}
  #graph .hub text{font:calc(12px*var(--s)) var(--mono);fill:var(--mute);letter-spacing:0;transition:fill .35s;paint-order:stroke;stroke:var(--paper);stroke-width:3px;stroke-linejoin:round}
  #graph .hub.lit rect{fill:var(--ink)}
  #graph .hub.lit text{fill:var(--ink)}
  #graph .anchor text{font:500 calc(12px*var(--s)) var(--mono);fill:var(--mute);letter-spacing:.4px;text-transform:uppercase;paint-order:stroke;stroke:var(--paper);stroke-width:3px;stroke-linejoin:round}
  #graph .anchor.on text{fill:var(--ink)}
  #graph.dimmed .node:not(.lit){opacity:.15}
  #graph.dimmed .edge:not(.lit){opacity:.15}
  #graph.dimmed .hub:not(.lit){opacity:.25}
  #graph.dimmed .anchor{opacity:.35}
  #graph.rest .g-main{opacity:.6}
  #graph.other .anchor:not(.on) ~ *{}
  #graph .g-over{pointer-events:none}
  #graph .path{fill:none;stroke:var(--ink);stroke-opacity:.7;stroke-width:1.2}
  #graph .sat circle{fill:var(--paper);stroke:var(--emerald);stroke-width:1.2}
  #graph .sat text{font:calc(11px*var(--s)) var(--mono);fill:var(--body);paint-order:stroke;stroke:var(--paper);stroke-width:3px;stroke-linejoin:round}
  #graph .nlabel{font:600 calc(12px*var(--s)) var(--mono);fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round}
  #graph .pik text{font:600 calc(11px*var(--s)) var(--mono);fill:var(--ink);text-anchor:middle}
  #graph .tip{position:absolute;pointer-events:none;background:var(--paper2);border:1px solid var(--rule);border-radius:8px;padding:6px 10px;font:12px/16px var(--mono);color:var(--body);white-space:nowrap;z-index:5;display:none}
  #graph .tip b{color:var(--ink);font-weight:600}
  #graph .gna{position:absolute;left:16px;top:12px}

  /* receipts panel */
  #panel{border-left:1px solid var(--rule);padding:14px 24px 12px;display:flex;flex-direction:column;gap:10px;min-height:0;overflow:hidden}
  body.present:not(.subjectonly) #panel{padding-bottom:6px}
  body.present:not(.subjectonly) .pfoot{padding-top:6px}
  body:not(.present) #panel{overflow:auto}
  #panel .phead{display:flex;align-items:center;gap:12px}
  #panel .phead .av{width:40px;height:40px;flex:none}
  #panel .phead .nm{font-size:calc(18px*var(--s));line-height:22px;font-weight:700;letter-spacing:-.5px}
  #panel .phead .line{font:calc(12px*var(--s))/16px var(--mono);color:var(--mute);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  #panel .phead .line .edit{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
  #panel .phead .line .edit:hover{color:var(--ink)}
  #panel .phead .badge{margin-left:auto}
  #panel .editform{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  #panel .editform input{border:1.5px solid var(--rule);border-radius:8px;padding:4px 8px;font:12px/16px var(--mono);background:var(--receipt);color:var(--ink);width:150px}
  #panel .editform input:focus{outline:none;border-color:var(--ink)}
  .cards{display:flex;flex-direction:column;gap:7px;min-height:0;overflow:hidden}
  body:not(.present) .cards{overflow:visible}
  .card{position:relative;background:var(--receipt);border-radius:14px;padding:8px 12px 8px;box-shadow:var(--shadow);border:1.5px solid transparent;transition:border-color .3s,box-shadow .3s}
  .card.grey{background:#0E0E0E}
  .card .ch{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:3px}
  .card .txt{font-size:calc(15px*var(--s));line-height:1.35;color:var(--ink);letter-spacing:-.2px}
  .card.grey .txt{color:var(--body)}
  .card.vp .txt{font-size:calc(16px*var(--s));line-height:1.28;font-weight:600;letter-spacing:-.5px}
  .card .from{margin-top:5px;display:flex;flex-wrap:wrap;gap:5px 6px;align-items:center}
  .card.em{border-color:var(--emerald);box-shadow:0 0 0 1px var(--emerald),var(--shadow)}
  .card.pin{border-color:var(--ink)}
  .card .src{display:none;margin-top:8px;padding:8px 10px;background:var(--paper);border-left:3px solid var(--rule);font:11.5px/16px var(--mono);color:var(--body);white-space:pre-wrap;border-radius:0 8px 8px 0}
  .card.open .src{display:block}
  .note{margin-top:8px;background:var(--ink);color:#0A0A0A;padding:7px 12px;border-radius:2px;font-size:13px;line-height:18px;transform:rotate(-.6deg);box-shadow:2px 3px 0 #0000001a;max-width:640px}
  .note b{font-weight:700;font-family:var(--mono);font-size:11px;letter-spacing:.3px}
  .annbox{display:flex;gap:8px;margin-top:8px}
  .annbox input{flex:1;border:1.5px solid var(--rule);border-radius:10px;padding:7px 12px;font:14px/20px var(--sans);background:var(--receipt);color:var(--ink);min-width:0}
  .annbox input:focus{outline:none;border-color:var(--ink)}
  .stub{cursor:pointer}
  .pfoot{margin-top:auto;display:flex;justify-content:space-between;gap:12px;font:calc(12px*var(--s))/16px var(--mono);color:var(--mute);border-top:1px dashed var(--rule);padding-top:8px}
  .pfoot .drop{color:var(--coral)}
  .reads{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .reads .rt{background:var(--receipt);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;min-width:0}
  .reads .rt .n{font:600 calc(20px*var(--s))/24px var(--mono);color:var(--ink)}
  .reads .rt .k{font:500 calc(12px*var(--s))/14px var(--mono);color:var(--mute);text-transform:uppercase;letter-spacing:.4px}
  .reads .rt .d{font-size:calc(13px*var(--s));line-height:16px;color:var(--body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .reads .rt.never{border:1px solid #FF616633}
  .reads .rt.never .n,.reads .rt.never .k{color:var(--coral)}
  .hubcard .txt{font-size:calc(16px*var(--s));line-height:1.35}

  /* popover */
  #pop{position:fixed;z-index:40;max-width:520px;background:var(--paper2);border:1px solid var(--rule);border-radius:12px;padding:10px 14px;font:12px/17px var(--mono);color:var(--body);box-shadow:0 20px 40px -20px #000;display:none;white-space:pre-wrap}
  #pop.on{display:block}
  #pop.pin{border-color:var(--ink)}
  #pop .k{color:var(--mute);font-size:10px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;display:flex;gap:8px;flex-wrap:wrap}
  #pop .k .fn{cursor:pointer}
  #pop .miss{color:var(--mute)}
  #pop .cov{display:flex;flex-wrap:wrap;gap:4px 6px;margin:4px 0}

  /* B5 ground strip */
  #b5{position:relative;border-top:1px solid var(--rule);overflow:hidden}
  #b5 svg{display:block;width:100%;height:100%}
  #b5 .land{fill:none;stroke:var(--mute);stroke-opacity:.4;stroke-width:.8}
  #b5 .grid{fill:var(--mute);opacity:.25}
  #b5 .pin circle{fill:var(--mute);transition:fill .4s,stroke .4s}
  #b5 .pin.lit circle{fill:var(--ink)}
  #b5 .pin.outline circle{fill:none;stroke:var(--ink);stroke-width:1.2}
  #b5 .pin.dim{opacity:.3}
  #b5 .pin text{font:calc(12px*var(--s)) var(--mono);fill:var(--mute);transition:fill .4s;paint-order:stroke;stroke:var(--paper);stroke-width:3px;stroke-linejoin:round}
  #b5 .pin.lit text{fill:var(--ink)}
  #b5 .slot{font:calc(12px*var(--s)) var(--mono);fill:var(--mute);paint-order:stroke;stroke:var(--paper);stroke-width:3px;stroke-linejoin:round}
  #b5 .slot.lit{fill:var(--ink)}
  #b5 .sna{position:absolute;left:16px;top:8px}

  /* toasts / dev */
  #toast{position:fixed;left:50%;bottom:250px;transform:translateX(-50%);background:var(--ink);color:#0A0A0A;padding:8px 14px;border-radius:10px;font:600 13px/18px var(--sans);display:none;z-index:30}
  #toast.on{display:block;animation:settle .3s ease-out}
  .hidden{display:none!important}

  /* subject mode */
  body.subjectonly #b3{visibility:hidden;padding:0;border:0}
  body.subjectonly #graph{display:none}
  body.subjectonly .cards{overflow:visible}
  body.subjectonly #app{grid-template-rows:56px 128px 0px minmax(0,1fr) var(--strip)}
  body.subjectonly #b4{grid-template-columns:minmax(0,1fr)}
  body.subjectonly #panel{border-left:0;padding:16px 32px;max-width:1100px}
  body.subjectonly.present #panel{overflow:auto}

<script src="/vendor/d3.min.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js'"></script>
<script>
// ---------- flags, state, helpers ----------
const QS=new URLSearchParams(location.search);
const F={present:QS.get('present')==='1',as:QS.get('as'),q:QS.get('q'),focus:QS.get('focus'),admin:QS.get('admin')==='1',nonum:QS.get('nonum')==='1',take:QS.get('take'),before:QS.get('before')==='1'};
const LOADED=Date.now()/1000;
const S={company:null,audit:null,cities:null,slot:null,graph:null,people:{},files:{},doc:[],tiles:[],draft:null,focus:null,panel:{mode:'rest'},drops:0,status:'At rest',source:null,concl:null,filed:null,docSeen:false,liveSince:0,seenRecords:new Set(),pending:null,legacyIgnore:false,droppedIds:new Set(),seenReceipts:new Set(),barDone:{},sessionOpen:false};
const recKey=r=>`${r.id||''}|${r.person||''}|${r.source_id||''}|${r.kind||''}`;
const $=s=>document.querySelector(s);
const nd=s=>String(s==null?'':s).replace(/[—–]/g,'-');
const esc=s=>nd(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const normq=s=>String(s||'').toLowerCase().replace(/[’]/g,"'").replace(/[“”]/g,'"').replace(/[^\w' ]+/g,' ').split(/\s+/).filter(Boolean).join(' ');
const words25=(t,n=25)=>{const w=String(t||'').trim().split(/\s+/);return w.length<=n?w.join(' '):w.slice(0,n).join(' ')+'…'};
const family=n=>String(n||'').trim().split(' ').pop().toLowerCase();
const first=n=>String(n||'').trim().split(' ')[0];
const NA=(what)=>`<span class="na" title="${esc(what||'')}">n/a</span>`;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function fetchJ(url,opts){try{const r=await fetch(url,opts);let d=null;try{d=await r.json()}catch(e){d=null}return {ok:r.ok,status:r.status,data:d}}catch(e){return {ok:false,status:0,data:null,err:String(e)}}}
const postJ=(url,body,method='POST')=>fetchJ(url,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});
function splitClaim(t){const m=/^(.+?): ["“](.*)["”]$/s.exec(String(t||''));return m?{ctx:m[1],txt:m[2]}:{ctx:'',txt:String(t||'')};}
const hash=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h};
function toast(t,ms=2600){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('on'),ms);}
function mouth(ms){const m=$('#mascot');m.classList.add('talk');clearTimeout(mouth._t);mouth._t=setTimeout(()=>m.classList.remove('talk'),ms);}
function setStatus(s){S.status=s;const el=$('#status');el.textContent=s;el.classList.toggle('on',s!=='At rest');$('#mascot').classList.toggle('listening',s==='Listening'||s==='Heard'||s==='Pik asks');}
function headerNA(t){const el=$('#hna');el.textContent=t||'';el.classList.toggle('hidden',!t);}

// public geography only; counts always come from the API
const CITY_FALLBACK={Tokyo:{lat:35.69,lon:139.69,tz:'Asia/Tokyo',abbr:'JST'},Osaka:{lat:34.69,lon:135.50,tz:'Asia/Tokyo',abbr:'JST'},Fukuoka:{lat:33.59,lon:130.40,tz:'Asia/Tokyo',abbr:'JST'},Singapore:{lat:1.35,lon:103.82,tz:'Asia/Singapore',abbr:'SGT'},Manila:{lat:14.60,lon:120.98,tz:'Asia/Manila',abbr:'PHT'},Austin:{lat:30.27,lon:-97.74,tz:'America/Chicago',abbr:'CT'}};
const REGION={'us side':['Austin'],'partner side':['Austin'],'japan side':['Tokyo','Osaka','Fukuoka'],'hq':['Tokyo','Osaka','Fukuoka']};
function cityOf(name){return (S.cities&&S.cities[name])||CITY_FALLBACK[name]||null}
const TF={};
function clock(tz,abbr){try{TF[tz]=TF[tz]||new Intl.DateTimeFormat('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:tz});return TF[tz].format(new Date())+(abbr?' '+abbr:'')}catch(e){return ''}}
function localTime(loc){const c=cityOf(loc);return c?clock(c.tz,c.abbr):''}
function refreshClocks(){document.querySelectorAll('[data-tz]').forEach(el=>{el.textContent=clock(el.dataset.tz,el.dataset.abbr)});document.querySelectorAll('#b5 .pin.lit text,#b5 .pin.hover text').forEach(t=>{const p=t.parentNode.__pin;if(p)t.textContent=pinLabel(p,true)});}
setInterval(refreshClocks,60000);

// ---------- icons and avatars ----------
const ICON={
  slack:'<svg viewBox="0 0 24 24"><path fill="#E01E5A" d="M6 15a2 2 0 1 1-2-2h2zm1 0a2 2 0 1 1 4 0v5a2 2 0 1 1-4 0z"/><path fill="#36C5F0" d="M9 6a2 2 0 1 1 2-2v2zm0 1a2 2 0 1 1 0 4H4a2 2 0 1 1 0-4z"/><path fill="#2EB67D" d="M18 9a2 2 0 1 1 2 2h-2zm-1 0a2 2 0 1 1-4 0V4a2 2 0 1 1 4 0z"/><path fill="#ECB22E" d="M15 18a2 2 0 1 1-2 2v-2zm0-1a2 2 0 1 1 0-4h5a2 2 0 1 1 0 4z"/></svg>',
  docs:'<svg viewBox="0 0 24 24"><path fill="#4285F4" d="M6 2h8l6 6v14H6z"/><path fill="#A1C2FA" d="M14 2v6h6z"/><path fill="#fff" d="M8 12h8v1.5H8zm0 3h8v1.5H8zm0 3h5v1.5H8z"/></svg>',
  wcm:'<svg viewBox="0 0 24 24"><path fill="#0F9D58" d="M6 2h8l6 6v14H6z"/><path fill="#87CEAC" d="M14 2v6h6z"/><path fill="#fff" d="M8 11h8v8H8zm1.5 1.5v1.5h2v-1.5zm3.5 0v1.5h2v-1.5zm-3.5 3v1.5h2v-1.5zm3.5 0v1.5h2v-1.5z"/></svg>',
  manager_notes:'<svg viewBox="0 0 24 24"><path fill="#7A8599" d="M3 17.25V21h3.75L17.8 9.94l-3.75-3.75zm17.7-10.2a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75z"/></svg>',
  sessions:'<svg viewBox="0 0 24 24"><path fill="#E0A83A" d="M12 2l1.8 5.2L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.8zM19 14l.9 2.6 2.6.9-2.6.9L19 21l-.9-2.6-2.6-.9 2.6-.9z"/></svg>'};
const ico=src=>ICON[src]||'';
const SHAPES=[
  (c,s)=>`<svg class="av" viewBox="0 0 72 72" style="width:${s}px;height:${s}px"><circle cx="36" cy="36" r="30" fill="${c}"/></svg>`,
  (c,s)=>`<svg class="av" viewBox="0 0 72 72" style="width:${s}px;height:${s}px"><rect x="7" y="7" width="58" height="58" rx="14" fill="${c}"/></svg>`,
  (c,s)=>`<svg class="av" viewBox="0 0 72 72" style="width:${s}px;height:${s}px"><path d="M9 66V33a27 27 0 0 1 54 0v33z" fill="${c}"/></svg>`];
const SHAPE_COLORS=['#EDEDED','#8A8A8A','#4A4A4A'];
function avatar(id,size=72){const fx=fixtureIndex(id);const k=fx>=0?fx:hash(id)%3;const c=fx>=0?SHAPE_COLORS[fx%3]:SHAPE_COLORS[1+hash(id+'c')%2];return SHAPES[k%3](c,size);}
function fixtureIndex(id){return S.company&&S.company.candidates?S.company.candidates.findIndex(c=>c.id===id):-1}

// ---------- people, files (evidence), trust ----------
function personOf(id){return S.people[id]||(S.company&&(S.company.candidates||[]).find(c=>c.id===id))||null}
function nameOf(id){const p=personOf(id);return p?p.name:id}
function isFixture(id){const p=S.people[id];if(p)return p.generated===false&&!p.added_by||!!p.seeded||fixtureIndex(id)>=0;return fixtureIndex(id)>=0}
function badgeOf(id){const p=personOf(id)||{};if(p.added_by)return `added by ${nameOf(p.added_by)}${p.added_at?' · '+String(p.added_at).slice(0,10):''}`;if(fixtureIndex(id)>=0||p.seeded)return 'seeded';if(p.generated)return 'simulated';return p.name?'simulated':''}
function labelOf(it){if(!it)return '';switch(it.source){case 'slack':return `Slack ${it.channel||''}, ${it.date||''}`;case 'wcm':return `Will Can Must sheet, ${it.date||''}`;case 'manager_notes':return `${it.manager||'manager'}'s note, ${it.date||''}`;case 'docs':return `Doc: ${String(it.title||'').replace(/,$/,'')}`;case 'sessions':return `AI session, opted in, ${it.date||''}`;default:return it.id||''}}
async function fileOf(id,force){
  if(S.files[id]&&!force)return S.files[id];
  const f={id,items:{},claims:[],will:null,manager:null,annotations:[],err:null,backend:null,drops:0};
  if(fixtureIndex(id)>=0){
    const r=await fetchJ(`/api/evidence/${encodeURIComponent(id)}`);
    if(r.ok&&r.data&&r.data.items){
      f.items=r.data.items;Object.values(f.items).forEach(it=>{it.label=labelOf(it)});
      const ev=r.data.evidence||{};f.backend=ev.backend||null;f.drops=(ev.dropped_unsourced||0)+(ev.dropped_unfaithful||0);
      f.claims=(ev.claims||[]).filter(c=>!['declared_will','manager_paraphrase'].includes(c.kind));
      const w=Object.values(f.items).find(i=>i.source==='wcm');if(w)f.will={text:w.will,sid:w.id,item:w};
      const m=Object.values(f.items).find(i=>i.source==='manager_notes');if(m)f.manager={text:m.text,sid:m.id,item:m};
      f.annotations=r.data.annotations||[];
    }else f.err=(r.data&&r.data.error)||`evidence ${r.status||'unreachable'}`;
  }else{
    const r=await fetchJ(`/api/people/${encodeURIComponent(id)}`);
    if(r.ok&&r.data&&(r.data.receipts||r.data.id)){
      const p=r.data;S.people[id]=Object.assign(S.people[id]||{},p);
      (p.receipts||[]).forEach(rc=>{const it=Object.assign({},rc,{author:id,rendered:rc.text});it.label=labelOf(it);f.items[rc.id]=it;f.claims.push({text:rc.text,kind:'did',source_ids:[rc.id],tags:[]});});
      if(p.will){f.will={text:p.will,sid:'will-'+id,item:{id:'will-'+id,source:'wcm',date:p.added_at?String(p.added_at).slice(0,10):'',rendered:p.will,label:'Will line (self-written)'}};f.items['will-'+id]=f.will.item;}
      f.backend='record';
    }else f.err=(r.data&&r.data.error)||`people/${id} ${r.status||'unreachable'}`;
  }
  S.files[id]=f;return f;
}
// trust rule: a tile needs a source id in the person's own file; a receipt's text must sit inside the item's rendered text
async function trustTile(t){if(!t||!t.id)return false;const f=await fileOf(t.id);if(f.err)return !!t.source_id;/* backend unreachable: keep, flagged n/a in the tile */return !!(t.source_id&&f.items[t.source_id])}
async function trustReceipt(b){const f=await fileOf(b.person);if(f.err)return false;const it=f.items[b.source_id];return !!(it&&normq(it.rendered||it.text).includes(normq(b.text)))}
function coveredIds(t){const out=[];if(t.covered&&typeof t.covered==='object')Object.values(t.covered).forEach(v=>(Array.isArray(v)?v:[v]).forEach(s=>{if(s&&!out.includes(s))out.push(s)}));if(!out.length&&t.source_id)out.push(t.source_id);return out}

// ---------- header ----------
function renderHeader(){
  const c=S.company||{};const d=c.decision||{};
  $('#purpose').innerHTML=d.title?`<b>${esc(d.title)}</b> · this page exists for this decision only`:NA('company');
  const a=S.audit;
  if(a&&a.used){const tot=Object.values(a.used).reduce((n,v)=>n+(v.count||0),0);const dm=(a.never_read||{}).dm||{};const sha=dm.sha256?` (manifest ${String(dm.sha256).slice(0,4)}…)`:'';
    $('#auditline').innerHTML=`Read ${tot} · <span class="never">Never read: DMs ${dm.count==null?'?':dm.count}${esc(sha)}</span> · private channels excluded`;}
  else $('#auditline').innerHTML=`Read ${NA('audit')} · <span class="never">Never read: DMs</span> · private channels excluded`;
  const b=S.source||(c.backend==='heuristic'?'keyword mode':(c.backend?'read by Gemini':''));$('#badge').textContent=b;$('#badge').classList.toggle('hidden',!b);
}

// ---------- B2 conversation ----------
function typeIn(el,text,ms=400){if(el.dataset.text===text)return;el.dataset.text=text;const t0=performance.now();const step=()=>{const k=Math.min(1,(performance.now()-t0)/ms);el.textContent=text.slice(0,Math.ceil(text.length*k));if(k<1)requestAnimationFrame(step)};step();}
function renderB2(){
  const box=$('#conv');
  if(F.as){const me=personOf(F.as);box.innerHTML=`<div class="banner"><b>You are ${esc(me?me.name:F.as)}.</b> This is exactly the page HR sees about you. Open any receipt and add a note; it lands on their page before the decision is made.</div>`;return;}
  const q=S.doc.find(b=>b.type==='question'),ask=S.doc.find(b=>b.type==='ask'),cons=S.doc.filter(b=>b.type==='constraint');
  const parts=[];
  if(q)parts.push(`<div class="question"><span class="eyebrow">${S.doc.heardEyebrow||'Heard'}</span><div class="qt" id="qt"></div></div>`);
  if(ask)parts.push(`<div class="askbar"><span class="spk"><svg viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a9 9 0 0 1 0 14"/></svg>Pik asks</span><span>${esc(ask.text)}</span>${ask.actions?`<span class="act-wrap act">${ask.actions}</span>`:''}</div>`);
  else if(cons.length)parts.push(`<div class="chips">${cons.map(c=>`<span class="chip">${esc(c.text)}</span>`).join('')}</div>`);
  const showInput=!q&&!ask&&!document.body.classList.contains('meeting');
  if(showInput||F.admin)parts.push(`<div class="inrow ${q||ask?'dev':''}"><input id="ask" type="text" placeholder="Ask who fits, or tell Pik about a person" autocomplete="off"><button class="act ghost" id="go">Ask Pik</button></div>`);
  const prev=$('#ask')?$('#ask').value:'';const prevQ=$('#qt')?$('#qt').dataset.text:null;
  box.innerHTML=parts.join('');box.classList.toggle('hasask',!!ask);
  if(q){const qt=$('#qt');const txt=nd(q.text);if(prevQ===txt){qt.dataset.text=txt;qt.textContent=txt}else typeIn(qt,txt,q.instant?1:400)}
  const inp=$('#ask');if(inp){inp.value=prev||(F.q&&!S.tiles.length?F.q:'')||'';inp.addEventListener('keydown',e=>{if(e.key==='Enter')submitAsk()});$('#go').addEventListener('click',submitAsk);}
}

// ---------- B3 tiles ----------
function tileFromAsk(row){const rc=(row.receipts||[])[0]||{};return {id:row.id,name:row.name,role:row.role,team:row.team,location:row.location,why:rc.text||(row.why||[])[0]||'',source:rc.source||'',source_id:rc.source_id||null,confidence:row.confidence,asked:row.asked,covered:row.covered,missing:row.missing,support:row.support}}
function sortAZ(ts){return ts.slice().sort((a,b)=>family(a.name).localeCompare(family(b.name))||String(a.name).localeCompare(String(b.name)))}
function confidenceHTML(t){
  const w=first(t.name||'');const asked=Array.isArray(t.asked)?t.asked:null;const covered=t.covered&&typeof t.covered==='object'?Object.keys(t.covered):null;
  const conf=typeof t.confidence==='number'?t.confidence:null;
  if(asked&&asked.length<3)return `<div class="num" style="color:var(--mute)">Too few words to count${S.doc.some(b=>b.type==='ask')?' · Pik asks instead':''}</div>`;
  const done=S.barDone[t.id]===conf;const bar=`<div class="bar"><i data-w="${conf}"${done?` style="width:${conf}%"`:''}></i></div>`; // the 600 ms fill plays once per tile and number, not on every patch
  if(conf==null)return `<div class="bar"><i style="width:0"></i></div><div class="num">Evidence for this ask · ${NA('confidence missing from the API row')}</div>`;
  if(conf===0)return `<div class="bar"><i style="width:0"></i></div><div class="num" style="color:var(--mute)">nothing on file bears on these words</div>`;
  if(F.nonum)return bar+`<div class="copy">${covered?covered.length:'?'} of ${asked?asked.length:'?'} words you asked for have a receipt. Not a score of ${esc(w)}.</div>`;
  return bar+`<div class="num"><button data-conf="${esc(t.id)}">Evidence for this ask · ${conf}</button></div><div class="copy">${covered?covered.length:'?'} of ${asked?asked.length:'?'} words you asked for have a receipt. Not a score of ${esc(w)}.</div>`;
}
function tileHTML(t,i){
  const st=t.state||'';const time=t.location?localTime(t.location):'';const c=cityOf(t.location);
  const why=splitClaim(t.why||'').txt;const meta=[t.role,t.team,t.location?`${t.location}${time?', ':''}`:null].filter(Boolean).map(esc).join(' · ')+(time&&c?`<span data-tz="${c.tz}" data-abbr="${c.abbr}">${esc(time)}</span>`:'');
  const src=(t.state==='back'&&t.confidence===0)?'':t.source_id?`<span class="fn ${t.em?'em':''}" data-sid="${esc(t.source_id)}" data-pid="${esc(t.id)}" title="${esc(t.source_id)}">${ico(sourceKind(t))}${esc(words25(t.source||t.source_id,6))}</span>`:NA('no source id: this tile has no receipt');
  const reason=t.dim_reason?`<span class="reason">${esc(t.dim_reason)}</span>`:'';
  return `<div class="tile ${st} ${t.em?'emring':''} ${S.focus===t.id?'focus':''}" data-id="${esc(t.id)}" role="button" tabindex="0">${avatar(t.id,72)}<div style="min-width:0">
    <div class="nm">${esc(t.name)}</div><div class="meta">${meta}</div>
    <div class="why">${t.state==='back'&&t.confidence===0?'<span style="color:var(--mute)">nothing on file bears on these words</span>':esc(words25(why))}</div>
    <div class="row">${src}<span class="badge soft">${esc(badgeOf(t.id)||'—')}</span>${reason}</div>
    ${t.state==='back'&&t.confidence===0?'':confidenceHTML(t)}
  </div></div>`;
}
function sourceKind(t){const f=S.files[t.id];const it=f&&f.items[t.source_id];if(it)return it.source;const s=String(t.source||'').toLowerCase();return s.startsWith('slack')?'slack':s.startsWith('doc')?'docs':s.startsWith('will')?'wcm':s.startsWith('ai')?'sessions':s.includes('note')?'manager_notes':''}
function draftHTML(d){
  const p=d.draft||{};const co=String((S.company||{}).name||'').replace(/\s*\(.*\)$/,'')||'the company';const fn=first(p.name||'');
  const meta=[p.role,p.team,p.location].filter(Boolean).map(esc).join(' · ');
  const chan=p.team?`#${String(p.team).toLowerCase().replace(/[^a-z]+/g,'-').replace(/-$/,'')}`:'their team channel';
  const label=d.intent==='add'?`Add to ${co}`:d.intent==='edit'?'Save the change':'Remove';

async function setTiles(tiles,opts={}){
  // trust rule first, then confidence enrichment (POST /api/ask with pool) when the rows lack it
  const kept=[];for(const t of tiles){if(await trustTile(t))kept.push(t);else S.drops++;}
  const need=kept.filter(t=>typeof t.confidence!=='number'&&!t.noconf);
  if(need.length&&opts.criterion){const r=await postJ('/api/ask',{question:opts.criterion,pool:kept.map(t=>t.id),k:kept.length||3,requester:requester()});
    if(r.ok&&r.data&&Array.isArray(r.data.people)){r.data.people.forEach(row=>{const t=kept.find(x=>x.id===row.id);if(t){t.confidence=row.confidence;t.asked=row.asked;t.covered=row.covered;t.missing=row.missing;if(!t.why&&row.receipts&&row.receipts[0]){t.why=row.receipts[0].text;t.source=row.receipts[0].source;t.source_id=row.receipts[0].source_id}}});
      kept.forEach(t=>{if(typeof t.confidence!=='number'&&r.data.people.length&&typeof r.data.people[0].confidence==='number'){t.confidence=0}});}}
  kept.forEach(t=>{t.criterion=opts.criterion||t.criterion;t.state=(t.confidence===0)?'back':'';});
  S.tiles=kept;renderTiles();renderPanelFooter();
  if(opts.light!==false){lightGraph(sortAZ(kept));lightPins(kept.map(t=>t.location));kept.forEach(t=>{const n=t.location;});}
}

  S.draft=(d.draft&&d.draft.name)||d.intent!=='add'?{intent:d.intent,draft:d.draft||{},missing:d.missing||[],backend:d.backend||'rules',ambiguous:d.ambiguous||[],target:(d.target&&d.target.id)||(typeof d.target==='string'?d.target:null)||d.id||null,changes:d.changes||d.patch||(Array.isArray(d.changed)&&d.draft?Object.fromEntries(d.changed.filter(k=>k in d.draft).map(k=>[k,d.draft[k]])):null),confirmText:d.confirm||null}:null;
  S.doc=S.doc.filter(b=>b.type!=='ask');
  if(d.question||(d.missing&&d.missing.length)||(d.ambiguous&&d.ambiguous.length)){S.doc.push({type:'ask',id:'crud-ask',text:d.question||`Which ${(d.missing||[])[0]||'team'} is ${first((d.draft||{}).name||'this person')} on?`});setStatus('Pik asks');}
  inp.value='';renderTiles();renderB2();
  if(d.intent==='add'&&d.draft&&d.draft.location)outlinePin(d.draft.location,true);
}
async function runAsk(text,opts={}){setStatus('Heard');mouth(600);
  S.doc=S.doc.filter(b=>!['question','people','ask','receipt'].includes(b.type));S.doc.push({type:'question',id:'q-local',text});S.doc.heardEyebrow='Asked';
  let payload=opts.payload;if(!payload){const r=await postJ('/api/ask',{question:text,requester:requester()});if(!r.ok||!r.data){toast('n/a · '+((r.data&&r.data.error)||`ask ${r.status||'unreachable'}`));renderB2();return}payload=r.data}
  if(opts.note)headerNA(opts.note);
  const rows=(payload.people||[]).map(tileFromAsk);
  if(payload.follow_up&&(!rows.length||(Array.isArray(payload.people[0]&&payload.people[0].asked)&&payload.people[0].asked.length<3)))S.doc.push({type:'ask',id:'fu-local',text:payload.follow_up});
  renderB2();
  await setTiles(rows,{criterion:text});
  const inp=$('#ask');if(inp)inp.value='';
  if(rows.length){const f=(F.focus&&rows.some(r=>r.id===F.focus))?F.focus:null;if(f)focusPerson(f,{from:'ask'});}
  if(S.doc.some(b=>b.type==='ask'))setStatus('Pik asks');
}
async function confirmDraft(){if(confirmDraft.busy)return;const d=S.draft;if(!d)return;const p=d.draft||{};let r;confirmDraft.busy=true;const cb=$('#confirm');if(cb)cb.disabled=true;try{
  if(d.intent==='add'){r=await postJ('/api/people',{name:p.name,role:p.role,team:p.team,location:p.location,languages:p.languages||[],skills:p.skills||[],availability:p.availability||'available',requester:requester()});
    if(r.ok&&r.data&&r.data.person){const person=r.data.person;S.draft=null;S.pending=null;S.doc=S.doc.filter(b=>b.id!=='crud-ask');const key='add:'+person.id;S.seenRecords.add(key);applyEvent({t:Date.now()/1000,kind:'record',op:'add',person,by:requester(),said:'added by HR',local:true});return}
  }else if(d.intent==='edit'){const id=d.target||(p.id);if(!id){toast('n/a · no person id in the draft');return}
    const body=d.changes||Object.fromEntries(Object.entries(p).filter(([k,v])=>['role','team','location','languages','availability','skills','will'].includes(k)&&v!=null));r=await postJ(`/api/people/${encodeURIComponent(id)}`,body,'PATCH');
    if(r.ok&&r.data&&r.data.person){S.draft=null;S.pending=null;S.doc=S.doc.filter(b=>b.id!=='crud-ask');S.seenRecords.add('edit:'+id);applyEvent({t:Date.now()/1000,kind:'record',op:'edit',person:r.data.person,changed:Object.keys(body),by:requester(),local:true});return}
  }else if(d.intent==='remove'){const id=d.target||p.id;if(!id){toast('n/a · no person id in the draft');return}
    if(!d.second){d.second=true;S.doc=S.doc.filter(b=>b.type!=='ask');S.doc.push({type:'ask',id:'crud-ask',text:d.confirmText||`This removes ${p.name||nameOf(id)}'s record and their receipts from Pik. Continue?`});renderB2();const c=$('#confirm');if(c)c.textContent='Yes, remove';return}
    r=await postJ(`/api/people/${encodeURIComponent(id)}`,{},'DELETE');
    if(r.ok&&r.data&&r.data.ok){const was=personOf(id)||{};S.draft=null;S.pending=null;S.doc=S.doc.filter(b=>b.id!=='crud-ask');S.seenRecords.add('remove:'+id);applyEvent({t:Date.now()/1000,kind:'record',op:'remove',person:Object.assign({id,location:was.location,team:was.team},r.data.removed||{}),by:requester(),local:true});return}
  }
  const err=(r&&r.data&&(r.data.error+(r.data.missing?` · missing: ${r.data.missing.join(', ')}`:'')))||`write ${r&&r.status||'unreachable'}`;toast('n/a · '+err,4000);
  const c=$('#confirm');if(c){c.disabled=false;c.insertAdjacentHTML('afterend',`<span class="na">${esc(err)}</span>`)}
  }finally{confirmDraft.busy=false;const cc=$('#confirm');if(cc&&S.draft)cc.disabled=false}
}

// ---------- the one renderer over both sources ----------
function resetSession(){S.doc=[];S.tiles=[];S.draft=null;S.concl=null;S.filed=null;S.drops=0;S.docSeen=false;S.panel={mode:'rest'};S.focus=null;S.droppedIds=new Set();S.seenReceipts=new Set();S.barDone={};$('#concl').className='';$('#concl').innerHTML='';if(G.ready){$('#graph').classList.remove('dimmed');$('#graph').classList.add('rest');G.ov&&G.ov.selectAll('*').remove();G.pik=null;G.sel.nodes.classed('lit emr con',false);G.sel.hubs.classed('lit',false);G.sel.edges.classed('lit',false)}document.querySelectorAll('#b5 .pin').forEach(p=>{p.classList.remove('lit','dim','outline');p.querySelector('text').textContent=pinLabel(p.__pin,false)});const sl=$('#slotlbl');if(sl)sl.classList.remove('lit');renderTiles();renderB2();renderPanel();}
async function applyEvent(e,instant){
  if(!e||!e.kind)return;const k=e.kind;
  if(k==='status'){const t=String(e.text||'');const reconnect=/session ended, reconnecting/i.test(t);const isEnd=!reconnect&&/\bstopped\b|session ended|: end$/i.test(t);
    const isStart=!isEnd&&/^scripted take: listening|^listening on |^simulated call/i.test(t);
    if(isStart){S.source=/^scripted take/i.test(t)?'scripted':'live';}
    if(/ failed \(/i.test(t))headerNA('n/a · '+t); // a failed row is reported, never a reason to wipe the screen
    if(isStart&&(!S.sessionOpen||/^scripted take/i.test(t))){ // a new session (a scripted take always is one); live.py's reconnect keeps the document
      document.body.classList.add('meeting');if(S.docSeen||S.tiles.length||S.panel.mode!=='rest')resetSession();S.legacyIgnore=false;setStatus('Listening');headerNA('');}
    else if(isStart){document.body.classList.add('meeting');if(!S.docSeen&&!S.tiles.length)setStatus('Listening');}
    if(isStart)S.sessionOpen=true;if(isEnd)S.sessionOpen=false;
    if(isEnd){document.body.classList.remove('meeting');$('#mascot').classList.remove('listening');if(!S.docSeen&&!S.tiles.length){setStatus('At rest');S.source=null;}else if(S.status==='Listening'||S.status==='Heard'||S.status==='Pik asks'){setStatus(S.filed?'Filed':S.concl?'Concluded':'Heard');$('#mascot').classList.remove('listening')}}
    renderHeader();renderB2();renderPanelFooter();return}
  if(k==='heard'){if(F.as)return;mouth(600);setStatus('Heard');document.body.classList.add('meeting');
    if(!S.doc.some(b=>b.type==='question')){S.doc.push({type:'question',id:'heard',text:e.text||'',instant});S.doc.heardEyebrow='Heard'}
    else if(!S.doc.some(b=>b.type==='people')){const q=S.doc.find(b=>b.type==='question');q.text=e.text||q.text;q.instant=instant}
    renderB2();return}
  if(k==='said'){mouth(2000);return}
  if(k==='compose'||k==='patch'){if(F.as)return;
    const doc=Array.isArray(e.doc)?e.doc:null;if(doc)S.doc=doc.slice();else if(e.block){const b=e.block;S.doc=S.doc.filter(x=>x.id!==b.id&&!(['question','people','ask'].includes(b.type)&&x.type===b.type));if(e.op!=='remove')S.doc.push(b)}
    S.docSeen=true;S.legacyIgnore=true;S.doc.heardEyebrow='Heard';mouth(600);
    // trust rule on receipt blocks
    let recs=S.doc.filter(b=>b.type==='receipt');for(const r of recs){const rk=recKey(r);if(S.droppedIds.has(rk)){S.doc=S.doc.filter(x=>x!==r);continue}if(!(await trustReceipt(r))){S.doc=S.doc.filter(x=>x!==r);S.droppedIds.add(rk);S.drops++}}recs=S.doc.filter(b=>b.type==='receipt');renderPanelFooter(); // every patch carries the full doc: a dropped receipt is dropped once and counted once
    const people=S.doc.find(b=>b.type==='people');
    if(S.doc.some(b=>b.type==='ask'))setStatus('Pik asks');else if(S.status==='Pik asks')setStatus('Heard');
    renderB2();
    if(people){const tiles=(people.tiles||[]).map(t=>Object.assign({},t));const same=S.tiles.length===tiles.length&&tiles.every(t=>S.tiles.some(x=>x.id===t.id))&&S.tiles[0]&&S.tiles[0].criterion===people.criterion;
      if(!same)await setTiles(tiles,{criterion:people.criterion,light:!instant});else{tiles.forEach(t=>{const x=S.tiles.find(y=>y.id===t.id);if(x&&typeof t.confidence==='number')Object.assign(x,{confidence:t.confidence,asked:t.asked,covered:t.covered,missing:t.missing})});}}
    else if(S.tiles.length&&!recs.length){S.tiles=[];renderTiles()}
    constrainGraph();renderTiles();
    const last=recs[recs.length-1];const fresh=!!(last&&!S.seenReceipts.has(recKey(last)));recs.forEach(r=>S.seenReceipts.add(recKey(r)));
    if(last&&fresh){await focusPerson(last.person,{from:'doc'});pulseNode(last.person)} // the ring means 'receipt that fed it': it fires when a receipt arrives, not on every patch
    else if(last&&S.panel.mode==='person'&&S.panel.id===last.person){await renderPanel()}
    return}
  if(k==='dropped'){S.drops++;renderPanelFooter();return}
  if(k==='conclude'){if(F.as)return;S.concl=e;setStatus('Concluded');renderConcl();concludeGraph(e.candidate_ids||[]);return}
  if(k==='filed'){if(F.as)return;S.filed=e;setStatus('Filed');renderConcl();return}
  if(k==='record'){const key=`${e.op}:${e.person&&e.person.id}`;if(!e.local&&S.seenRecords.has(key)){S.seenRecords.delete(key);return}
    const p=e.person||{};mouth(600);
    if(e.op==='add'){if(p.id)S.people[p.id]=Object.assign({},p,{added_by:p.added_by||nameOf(e.by||requester())});S.draft=null;renderTiles();renderB2();if(!instant)flyIn(Object.assign({},p,{added_by:p.added_by||nameOf(e.by||requester())}));if(p.location){outlinePin(p.location,false);bumpPin(p.location,instant?0:1)}}
    if(e.op==='edit'&&p.id){S.people[p.id]=Object.assign(S.people[p.id]||{},p);}
    if(e.op==='remove'&&p.id){delete S.people[p.id];removeNode(p.id);S.tiles=S.tiles.filter(t=>t.id!==p.id);renderTiles();if(p.location)bumpPin(p.location,-1)}
    if(!F.as&&!instant){S.panel={mode:'record',rec:e};renderPanel();}
    if(!instant)toast(e.op==='add'?`${p.name||'Record'} added · receipts arrive as they work`:e.op==='edit'?`${p.name||'Record'} updated`:`${p.name||'Record'} removed`);
    return}
  // legacy rows, honoured only until a composed doc has arrived in this session
  if(k==='show_candidates'){if(F.as||S.legacyIgnore)return;setStatus('Heard');S.doc=S.doc.filter(b=>b.type!=='people');if(!S.doc.some(b=>b.type==='question'))S.doc.push({type:'question',id:'legacy-q',text:e.criterion||'',instant});
    const r=await postJ('/api/ask',{question:e.criterion||'',pool:e.ranking||[],k:(e.ranking||[]).length||3});renderB2();if(r.ok&&r.data)await setTiles((r.data.people||[]).map(tileFromAsk),{criterion:e.criterion,light:!instant});return}
  if(k==='note'){if(F.as||S.legacyIgnore)return;if(!S.doc.some(b=>b.type==='constraint'&&b.text===e.text))S.doc.push({type:'constraint',id:'legacy-c'+hash(e.text),text:e.text,affects:[]});renderB2();return}
  if(k==='follow_up'){if(F.as||S.legacyIgnore)return;S.doc=S.doc.filter(b=>b.type!=='ask');S.doc.push({type:'ask',id:'legacy-a',text:e.text});setStatus('Pik asks');renderB2();return}
}
function pulseNode(id){if(!G.ready)return;const sel=G.sel.nodes.filter(d=>d.id===id);sel.classed('lit',true).classed('emr',true).raise();setTimeout(()=>sel.classed('emr',false),4000)}
function renderConcl(){const c=S.concl;const el=$('#concl');if(!c){el.className='';return}
  const ids=c.candidate_ids||[];const ns=c.next_steps||[];const oq=c.open_questions||[];const f=S.filed;
  const filedLine=f?`Filed · ${(f.open_questions||[]).length} question${(f.open_questions||[]).length===1?'':'s'}${(f.open_questions||[]).length?' to '+[...new Set((f.open_questions||[]).map(q=>first(nameOf(q.person))))].join(' and '):''} · ${(f.notified||[]).map(id=>first(nameOf(id))).join(' and ')||'nobody'} can see this page`:'Not filed yet';
  el.innerHTML=`<div><span class="eyebrow">What this meeting concluded</span><div class="sum">${esc(words25(c.summary||'',40))}</div><div class="who">${ids.map(id=>`<span>${esc(nameOf(id))}</span>`).join('')||`<span class="na">nobody shortlisted</span>`}</div></div>
  <div>${ns.length?`<span class="eyebrow">Next steps</span><ul>${ns.map(x=>`<li>${esc(words25(x))}</li>`).join('')}</ul>`:''}${oq.length?`<span class="eyebrow" style="margin-top:6px;display:block">Ask them before deciding</span><ul>${oq.map(x=>`<li>${esc(words25(typeof x==='string'?x:x.text))}</li>`).join('')}</ul>`:''}</div>
  <div class="foot"><span class="filed ${f?'on':''}">${esc(filedLine)}</span><span style="display:flex;gap:8px"><button class="act ghost" id="c-calls">Set up the calls</button><button class="act" id="c-memo">Print the memo with receipts</button></span></div>`;
  el.className='on';document.body.classList.remove('nob3');
  $('#c-calls').addEventListener('click',()=>{lightPins(ids.map(id=>(personOf(id)||{}).location));toast('Times shown on the strip. Pik sets nothing up for you.')});
  $('#c-memo').addEventListener('click',async()=>{const id=ids[0];if(!id)return;const q=S.tiles[0]&&S.tiles[0].criterion||'';window.open(`/api/memo/${encodeURIComponent(id)}?criterion=${encodeURIComponent(q)}`,'_blank')});
}
async function pollLive(){try{const r=await fetchJ('/api/live?since='+S.liveSince);if(r.ok&&r.data&&Array.isArray(r.data.events)){for(const e of r.data.events){S.liveSince=Math.max(S.liveSince,e.t||0);await applyEvent(e,e.t<LOADED)}}}catch(err){}setTimeout(pollLive,800)}
async function primeLive(){ // historical rows: apply only a recent, still-open session, without animation
  const r=await fetchJ('/api/live?since=0');if(!r.ok||!r.data||!Array.isArray(r.data.events))return;const rows=r.data.events;if(!rows.length)return;
  const last=rows[rows.length-1];const lastStatus=rows.filter(x=>x.kind==='status').pop();
  S.liveSince=Math.max(...rows.map(x=>x.t||0));
  if(LOADED-(last.t||0)>600)return;if(lastStatus&&/stopped|session ended|: end$/i.test(lastStatus.text||''))return;
  if(!lastStatus)return; // record-only history: people.json, /api/graph and /api/cities already carry it
  for(const e of rows){if(e.kind==='record')continue;await applyEvent(e,true)}
}

// ---------- takes (one URL each) ----------
async function runTake(){
  if(F.take==='meet'){await sleep(1500);const r=await postJ('/api/take',{name:'meet'});if(!r.ok){headerNA(`n/a · /api/take ${r.status||'unreachable'}: ${(r.data&&r.data.error)||''}`);return}
    await sleep(3000);const st=await fetchJ('/api/take');if(st.ok&&st.data&&!st.data.running&&S.liveSince<=LOADED)headerNA(`n/a · take exited (code ${st.data.exit_code}) before writing a row${st.data.venv===false?' · prototype/.venv missing (make setup)':''}`);return}
  if(F.take==='crud'){let sentence=null;const r=await fetchJ('/scripts/crud.json');
    if(r.ok&&r.data){sentence=r.data.text||r.data.sentence||r.data.say||(Array.isArray(r.data.rows)&&r.data.rows[0]&&(r.data.rows[0].text||r.data.rows[0].say))||(Array.isArray(r.data)&&r.data[0]&&(r.data[0].text||r.data[0].say));}
    if(!sentence){headerNA(`n/a · /scripts/crud.json ${r.status||'unreachable'}`);return}
    S.source='scripted';renderHeader();const inp=$('#ask');if(!inp){headerNA('n/a · no input (add ?admin=1)');return}inp.focus();inp.value='';
    const tms=(r.data&&r.data.type_ms)||22;for(const ch of sentence){inp.value+=ch;await sleep(tms)}
    await submitAsk();const t0=Date.now();while(!$('#confirm')&&Date.now()-t0<4000)await sleep(50);await sleep(800);const c=$('#confirm');if(c&&!c.disabled)c.click();else headerNA('n/a · draft did not appear');}
}

// ---------- init ----------
async function init(){
  if(F.present)document.body.classList.add('present');if(F.admin)document.body.classList.add('admin');if(F.as)document.body.classList.add('subjectonly');
  if(F.take){S.source='scripted';const rr=await postJ('/api/reset',{people:true});if(!rr.ok)headerNA(`n/a · /api/reset ${rr.status||'unreachable'}`);} // a take starts from people.base.json, before the graph and strip count anyone
  if(F.take==='crud')addEventListener('pagehide',()=>{try{navigator.sendBeacon&&navigator.sendBeacon('/api/reset',new Blob([JSON.stringify({people:true})],{type:'text/plain'}))}catch(e){}}); // Mika Ono leaves with the tab: the next page load counts 200 again
  const [co,au]=await Promise.all([fetchJ(F.as?`/api/company?view=subject&cid=${encodeURIComponent(F.as)}`:'/api/company'),fetchJ('/api/audit')]);
  if(co.ok&&co.data&&!co.data.error)S.company=co.data;
  else if(F.as){const c2=await fetchJ('/api/company');if(c2.ok&&c2.data){S.company=Object.assign({},c2.data,{candidates:[]})}}
  if(!S.company)S.company={name:'',decision:{},candidates:[],backend:null};
  if(au.ok&&au.data)S.audit=au.data;
  (S.company.candidates||[]).forEach(c=>{S.people[c.id]=Object.assign(S.people[c.id]||{},c,{seeded:true,generated:false})});
  const pl=S.company.decision&&S.company.decision.planner;if(pl&&pl.id)S.people[pl.id]=Object.assign(S.people[pl.id]||{},pl,{planner:true});
  renderHeader();renderB2();renderTiles();
  if(F.as){const own=await fetchJ(`/api/people/${encodeURIComponent(F.as)}`);if(own.ok&&own.data&&own.data.id)S.people[F.as]=Object.assign(S.people[F.as]||{},own.data);await fileOf(F.as);renderHeader();renderB2();await renderSubject();buildStrip();return}
  renderPanel();
  await Promise.all([buildGraph(),buildStrip()]);
  renderTiles();
  if(!F.take)await primeLive();else S.liveSince=LOADED;
  if(F.q){const inp=$('#ask');if(inp)inp.value=F.q;await runAsk(F.q)}
  pollLive();runTake();
}
init();
