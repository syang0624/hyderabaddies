<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pik</title>
<style>
  @font-face{font-family:Geist;src:url(/fonts/geist.woff2) format('woff2-variations');font-weight:100 900;font-display:swap}
  @font-face{font-family:"Geist Mono";src:url(/fonts/geist-mono.woff2) format('woff2-variations');font-weight:100 900;font-display:swap}
  :root{
    --page:#fafafa;--card:#ffffff;--soft:#f5f5f5;--ink:#171717;--body:#4d4d4d;--mute:#888888;--hair:#ebebeb;--land:#e6e6e6;
    --lime:#D6F25A;--lime-deep:#bfe030;--lime-tint:#f4fbd6;--red:#ee0000;--red-soft:#f7d4d6;
    --shadow:0 0 0 1px #00000014,0 1px 1px #00000005,0 2px 2px #0000000a;
    --sans:Geist,Inter,system-ui,-apple-system,sans-serif;--mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html{background:var(--page)}
  body{margin:0;background:var(--page);color:var(--ink);font:16px/24px var(--sans);letter-spacing:-.2px;-webkit-font-smoothing:antialiased;min-height:100vh}
  body.present:not(.subjectonly){width:1920px;height:1080px;overflow:hidden}
  ::selection{background:var(--ink);color:#f2f2f2}
  h1,h2,h3,p{margin:0}
  button,input{font:inherit;color:inherit;letter-spacing:inherit}
  a{color:var(--ink)}
  .mono{font-family:var(--mono)}
  .eyebrow{font:400 12px/16px var(--mono);color:var(--mute);text-transform:uppercase;letter-spacing:0}
  .na{font:400 12px/16px var(--mono);color:var(--red)}
  .hidden{display:none!important}
  .hit{font-style:normal;font-weight:600}
  .act{border:0;border-radius:8px;background:var(--ink);color:#f2f2f2;padding:8px 16px;font-size:14px;line-height:20px;font-weight:500;letter-spacing:-.28px;cursor:pointer;white-space:nowrap}
  .act.ghost{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
  .act[disabled]{opacity:.4;cursor:default}
  .chip{display:inline-flex;align-items:center;font:400 12px/16px var(--mono);color:var(--body);padding:3px 10px;border-radius:9999px;background:var(--card);box-shadow:var(--shadow);white-space:nowrap}
  .chip.lime{background:var(--lime);color:var(--ink);box-shadow:none}
  .chip.red{color:var(--red);background:var(--red-soft);box-shadow:none}
  .chip.who{animation:fadein .2s ease-out both}

  /* frame: left column and the right card */
  #app{display:grid;grid-template-columns:minmax(0,1.68fr) minmax(0,1fr);gap:24px;padding:32px;min-height:100vh}
  body.present:not(.subjectonly){width:auto;height:100vh;overflow:hidden}
  body.present:not(.subjectonly) #stage{position:fixed;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden}
  body.present:not(.subjectonly) #app{width:1920px;height:1080px;min-height:0}
  .left{display:flex;flex-direction:column;gap:16px;min-width:0;min-height:0}
  .right{min-width:0;min-height:0;position:relative}
  #drawer{position:absolute;inset:0;background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:28px;display:flex;flex-direction:column;gap:12px;overflow:auto;transform:translateX(106%);transition:transform .3s ease-out;z-index:8}
  #drawer.on{transform:none}
  #drawer .dh{display:flex;justify-content:space-between;gap:12px}
  #drawer .it{display:flex;flex-direction:column;gap:6px;padding:14px 16px;background:var(--soft);border-radius:8px}
  #drawer .it .q{font-size:16px;line-height:24px;letter-spacing:-.2px;color:var(--ink)}
  #drawer .it .src{font:400 12px/16px var(--mono);color:var(--mute)}
  #drawer .none{font-size:14px;line-height:20px;color:var(--body)}
  #rcard [data-drawer]{cursor:pointer}
  #hdr{display:flex;align-items:center;gap:12px;height:44px;flex:none}
  #hdr .sp{flex:1}
  #hdr #hna{min-width:0;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #hdr .ready{font:400 12px/16px var(--mono);color:var(--mute);display:none;align-items:center;gap:6px;white-space:nowrap}
  #hdr .ready::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--lime-deep)}
  #hdr .ready.on{display:inline-flex}
  #hdr .pill{font:400 12px/16px var(--mono);text-transform:uppercase;padding:3px 10px;border-radius:9999px;background:var(--card);box-shadow:var(--shadow);color:var(--mute);white-space:nowrap;transition:background .3s,color .3s}
  #hdr .pill.on{background:var(--lime);color:var(--ink);box-shadow:none}
  #hdr .pill.done{color:var(--ink)}
  .idchip{display:inline-flex;align-items:center;gap:8px;font:400 12px/16px var(--mono);color:var(--body);padding:3px 10px;border-radius:9999px;background:var(--card);box-shadow:var(--shadow);white-space:nowrap}
  .idchip b{font-weight:500;color:var(--ink)}
  .idchip a{color:var(--body);text-decoration:none}
  .idchip a:hover{color:var(--ink)}
  #subject .idrow{display:flex;justify-content:flex-end}
  #subject .shdr{display:flex;align-items:center;gap:12px;height:44px}
  #subject .shdr .sp{flex:1}

  /* the network over the map */
  #panel{position:relative;flex:1;min-height:160px;background:var(--soft);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
  #map{position:absolute;inset:0}
  #map svg{display:block;width:100%;height:100%}
  #map .land{fill:var(--land);opacity:.34}
  #map .city circle{fill:var(--mute)}
  #map .city text{font:400 12px var(--mono);fill:var(--mute);paint-order:stroke;stroke:var(--soft);stroke-width:3px;stroke-linejoin:round}
  #map .edge{fill:none;stroke:var(--ink);stroke-opacity:.35;stroke-width:1.2;stroke-dasharray:4 5;transition:stroke .4s,stroke-opacity .4s,opacity .4s}
  #map .edge.drawing{stroke-dasharray:none}
  #map .edge.lit{stroke:var(--lime-deep);stroke-opacity:1;stroke-width:2.4;stroke-dasharray:none}
  #map .edge.con{stroke-dasharray:2 6;stroke-opacity:.25}
  #map .edge.settle{opacity:.6}
  #map .leader{fill:none;stroke:var(--ink);stroke-opacity:.34;stroke-width:1}
  #map .kw{cursor:default;transition:opacity .4s}
  #map .kw rect{fill:var(--card);stroke:var(--hair);stroke-width:1}
  #map .kw text{font:400 12px var(--mono);fill:var(--ink)}
  #map .kw.thought{opacity:.4}
  #map .kw.thought rect{stroke:none;fill:#ffffffb3}
  #map .kw.thought text{fill:var(--body)}
  #map .kw.constraint rect{fill:var(--card);stroke:var(--ink);stroke-opacity:.35}
  #map .kw.settle{opacity:.6}
  #map .hub rect{fill:var(--ink)}
  #map .hub text{font:400 11px var(--mono);fill:var(--body);paint-order:stroke;stroke:var(--soft);stroke-width:3px;stroke-linejoin:round}
  #map .person{transition:opacity .4s}
  #map .person .disc{fill:var(--card);stroke:var(--hair);stroke-width:1;filter:drop-shadow(0 1px 1px #0000000a) drop-shadow(0 2px 2px #0000000a);transition:fill .4s,stroke .4s}
  #map .person .ini{font:600 14px var(--sans);fill:var(--ink);text-anchor:middle;letter-spacing:-.28px}
  #map .person .nm{font:600 14px var(--sans);fill:var(--ink);text-anchor:middle;letter-spacing:-.28px;paint-order:stroke;stroke:var(--soft);stroke-width:4px;stroke-linejoin:round}
  #map .person .rl{font:400 11px var(--mono);fill:var(--mute);text-anchor:middle;paint-order:stroke;stroke:var(--soft);stroke-width:3px;stroke-linejoin:round}
  #map .person.lit .disc{fill:var(--lime);stroke:var(--lime-deep)}
  #map .person.back{opacity:.55}
  #map .person.con{opacity:.4!important}
  #map .person.settle{opacity:.6}
  #map .person.chosen .disc{fill:var(--lime);stroke:var(--lime-deep);stroke-width:2}
  #map .pill rect{fill:var(--ink)}
  #map .pill text{font:400 12px var(--mono);fill:#f2f2f2}
  #map .pik .disc{fill:var(--lime)}
  #map .pik .pulse{fill:none;stroke:var(--lime-deep);stroke-width:2}
  #map .pik text{font:400 12px var(--mono);fill:var(--mute);text-anchor:middle}
  #map .reason text{font:400 11px var(--mono);fill:var(--mute);paint-order:stroke;stroke:var(--soft);stroke-width:3px;stroke-linejoin:round}
  .tools{position:absolute;top:16px;display:flex;gap:8px;z-index:2}
  .tools.l{left:16px}.tools.r{right:16px}
  .tools span{width:36px;height:36px;border-radius:9px;background:var(--card);box-shadow:var(--shadow);display:inline-flex;align-items:center;justify-content:center;color:var(--body)}
  .tools span svg{width:15px;height:15px}
  .plabel{position:absolute;left:24px;bottom:18px;font-size:20px;line-height:28px;font-weight:500;letter-spacing:-.6px;color:var(--ink);z-index:2}
  .pna{position:absolute;left:24px;bottom:52px;z-index:2}

  /* overlays over the left column: the draft, the conclusion */
  .over{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;width:640px;max-width:calc(100% - 48px);background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:24px 28px;display:none;flex-direction:column;gap:12px;animation:fadein .4s ease-out both}
  .over.on{display:flex}
  .over.lime{box-shadow:0 0 0 2px var(--lime),0 12px 32px -12px #00000026}
  .over .sum{font-size:24px;line-height:32px;font-weight:600;letter-spacing:-.96px}
  .over .nm{font-size:20px;line-height:28px;font-weight:600;letter-spacing:-.6px}
  .over .meta{font-size:14px;line-height:20px;color:var(--mute)}
  .over .why{font-size:14px;line-height:20px;color:var(--body)}
  .over .who{display:flex;gap:8px;flex-wrap:wrap}
  .over ol{margin:0;padding-left:20px;font-size:14px;line-height:20px;color:var(--body);display:flex;flex-direction:column;gap:4px}
  .over .filed{font:400 12px/16px var(--mono);color:var(--mute)}
  .over .filed.on{color:var(--ink)}
  .over .btns{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px}

  /* greeting row, waveform, mic */
  #greet{display:flex;align-items:center;gap:24px;flex:none;min-height:88px}
  #greet .pikav{width:88px;height:88px;border-radius:50%;background:var(--lime);flex:none;display:flex;align-items:center;justify-content:center}
  #greet .pikav svg{width:44px;height:50px}
  #greet .line{font-size:32px;line-height:40px;font-weight:400;letter-spacing:-1.28px;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-width:0}
  #greet .line b{font-weight:600}
  #wave{display:flex;align-items:center;justify-content:center;gap:12px;height:64px;flex:none}
  #wave .bars{display:flex;align-items:center;gap:4px;height:64px}
  #wave .bars i{display:block;width:4px;height:6px;border-radius:2px;background:var(--lime);transition:background .3s}
  #wave.said .bars i{background:var(--lime-deep)}
  #wave .wpill{padding:6px 18px;border-radius:9999px;background:var(--card);box-shadow:var(--shadow);font-size:14px;line-height:20px;color:var(--body);white-space:nowrap;min-width:150px;text-align:center}
  #microw{display:flex;flex-direction:column;align-items:center;gap:8px;flex:none}
  #microw .micline{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;width:100%}
  #microw .mic{grid-column:2;width:56px;height:56px;border-radius:50%;background:var(--ink);border:0;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:box-shadow .3s}
  #microw .mic svg{width:22px;height:22px}
  #microw .mic.on{box-shadow:0 0 0 4px var(--lime),0 0 0 10px var(--lime-tint)}
  #microw .mic:focus-visible{outline:2px solid var(--ink);outline-offset:12px}
  #microw .endb{grid-column:3;justify-self:start}
  #join{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  #join a{display:inline-flex;align-items:center;gap:6px;font-size:13px;line-height:18px;letter-spacing:-.2px;color:var(--ink);text-decoration:none;padding:4px 12px;border-radius:9999px;background:var(--card);box-shadow:var(--shadow);white-space:nowrap;cursor:pointer}
  #join a:hover{box-shadow:0 0 0 1px var(--body)}
  #join a[aria-disabled=true]{color:var(--mute);cursor:default;box-shadow:none;background:var(--soft)}
  #join .dot{width:6px;height:6px;border-radius:50%;background:transparent;box-shadow:inset 0 0 0 1px var(--mute)}
  #join .dot.run{background:var(--lime-deep);box-shadow:none}
  #join .dot.down{background:var(--mute);box-shadow:none}

  /* Pik asks, and the input bar */
  #askbar{height:48px;flex:none;display:flex;align-items:center}
  #askbar .asks{display:inline-flex;align-items:baseline;gap:12px;background:var(--lime-tint);border-radius:9999px;padding:8px 18px;font-size:16px;line-height:24px;color:var(--ink);max-width:100%;animation:fadein .3s ease-out both}
  #askbar .asks .k{font:400 12px/16px var(--mono);color:var(--body);text-transform:uppercase;white-space:nowrap}
  #askbar .asks span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #inwrap{position:relative;flex:none}
  #inbar{display:flex;align-items:center;gap:12px;height:60px;flex:none;background:var(--card);border-radius:9999px;box-shadow:var(--shadow);padding:8px}
  #inbar:focus-within{box-shadow:0 0 0 1px var(--body)}
  #inbar .pre{width:44px;height:44px;border-radius:50%;border:0;background:var(--soft);color:var(--body);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0}
  #inbar .pre svg{width:18px;height:18px}
  #inbar .pre[aria-expanded=true]{background:var(--lime);color:var(--ink)}
  #inbar .pre:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  #presets{position:absolute;left:0;right:0;bottom:calc(100% + 8px);z-index:20;display:none}
  #presets.list{display:flex;flex-direction:column;width:min(540px,100%);background:var(--card);border-radius:12px;box-shadow:var(--shadow),0 16px 32px -16px #00000033;padding:6px}
  #presets.list .k{font:400 12px/16px var(--mono);color:var(--mute);text-transform:uppercase;padding:8px 12px 4px}
  #presets.list button{width:100%;text-align:left;border:0;background:transparent;padding:8px 12px;border-radius:8px;font-size:14px;line-height:20px;letter-spacing:-.28px;color:var(--ink);cursor:pointer}
  #presets.list button:hover,#presets.list button:focus-visible{background:var(--soft);outline:none}
  #presets.chips{display:flex;flex-wrap:wrap;gap:8px}
  #presets.chips button{border:0;cursor:pointer;background:var(--card);box-shadow:var(--shadow);border-radius:9999px;padding:6px 12px;font-size:13px;line-height:18px;letter-spacing:-.2px;color:var(--ink);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #presets.chips button:hover,#presets.chips button:focus-visible{background:var(--lime-tint);outline:none}
  #inbar input{flex:1;min-width:0;margin-left:4px;border:0;background:transparent;outline:none;font-size:16px;line-height:24px;color:var(--ink);text-overflow:ellipsis}
  #inbar input::placeholder{color:var(--mute)}
  #inbar .send{width:44px;height:44px;border-radius:50%;background:var(--ink);border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
  #inbar .send svg{width:18px;height:18px}
  #foot{display:flex;align-items:center;gap:24px;height:20px;flex:none;font:400 12px/16px var(--mono);color:var(--mute);white-space:nowrap;overflow:hidden}
  #foot .red{color:var(--red)}
  #foot .sp{flex:1}
  #foot .na{color:var(--red)}

  /* right column: one tall card */
  #rcard{position:relative;height:100%;min-height:600px;background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:28px 28px 92px;display:flex;flex-direction:column;gap:16px;overflow:hidden}
  #rcard .ttl{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
  #rcard .ttl .nm{font-size:32px;line-height:40px;font-weight:600;letter-spacing:-1.28px;min-width:0}
  #rcard .ttl .rl{font-size:14px;line-height:20px;color:var(--body);letter-spacing:-.28px;margin-top:4px}
  #rcard .ttl .stat{text-align:right;flex:none;display:flex;align-items:baseline;gap:8px}
  #rcard .ttl .stat .k{font:400 12px/16px var(--mono);color:var(--mute);text-transform:uppercase}
  #rcard .ttl .stat .n{font-size:24px;line-height:32px;font-weight:600;letter-spacing:-.96px}
  #rcard .hero{background:var(--lime-tint);border-radius:8px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;transition:background .3s}
  #rcard .hero.flash{background:var(--lime)}
  #rcard .hero .ch{display:flex;justify-content:space-between;gap:12px;font:400 12px/16px var(--mono);color:var(--body);text-transform:uppercase}
  #rcard .hero .q{font-size:20px;line-height:30px;letter-spacing:-.4px;color:var(--ink);display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
  #rcard .hero .src{font:400 12px/16px var(--mono);color:var(--body)}
  #rcard .para{font-size:14px;line-height:20px;color:var(--body);letter-spacing:-.28px;display:flex;flex-direction:column;gap:6px}
  #rcard .para .t{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  #rcard .para .mgr{color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  #rcard .chips{display:flex;gap:6px;flex-wrap:wrap}
  #rcard .also{display:flex;flex-direction:column;gap:4px}
  #rcard .also .ao{font-size:14px;line-height:20px;color:var(--body);letter-spacing:-.28px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  #rcard .also .ao b{font-weight:600;color:var(--ink)}
  #rcard .also .src{font:400 12px/16px var(--mono);color:var(--mute)}
  #rcard .act-h{display:flex;justify-content:space-between;align-items:baseline}
  #rcard .act-h .t{font-size:16px;line-height:24px;font-weight:500;letter-spacing:-.32px}
  #rcard .big{font-size:40px;line-height:48px;font-weight:600;letter-spacing:-1.6px}
  #rcard .bars{height:64px;display:flex;align-items:flex-end;gap:6px}
  #rcard .bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
  #rcard .bars .b i{display:block;width:100%;border-radius:4px 4px 0 0;background:linear-gradient(to top,var(--lime-tint),var(--lime));transition:height .5s ease-out}
  #rcard .bars .b span{font:400 11px/14px var(--mono);color:var(--mute)}
  #rcard .mini{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  #rcard .mini .m{background:var(--soft);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
  #rcard .mini .m .k{font-size:14px;line-height:20px;color:var(--body);letter-spacing:-.28px}
  #rcard .mini .m .n{font-size:28px;line-height:36px;font-weight:600;letter-spacing:-1.12px}
  #rcard .mini .m .d{font:400 12px/16px var(--mono);color:var(--mute)}
  #rcard .note{font:400 12px/16px var(--mono);color:var(--mute)}
  #toastp{position:absolute;left:28px;right:28px;bottom:28px;background:var(--ink);color:#f2f2f2;border-radius:10px;padding:12px 16px;display:flex;align-items:center;gap:12px;opacity:0;transition:opacity .3s ease-out;pointer-events:none;box-shadow:0 0 0 2px var(--lime)}
  #toastp.on{opacity:1}
  #toastp .k{font-size:14px;line-height:20px;flex:1}
  #toastp .p{font-size:24px;line-height:32px;font-weight:600;letter-spacing:-.96px}
  #toastp .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--lime);border-radius:0 0 10px 10px;width:0;transition:width .2s linear}

  /* subject page: the same receipts as a plain list */
  #subject{max-width:960px;margin:0 auto;padding:32px;display:flex;flex-direction:column;gap:16px}
  #subject .h{font-size:32px;line-height:40px;font-weight:600;letter-spacing:-1.28px}
  #subject .sub{font-size:16px;line-height:24px;color:var(--body)}
  #subject.noanim .card{animation:none}
  .card{background:var(--card);border-radius:8px;box-shadow:var(--shadow);padding:20px 24px;display:flex;flex-direction:column;gap:12px;animation:fadein .3s ease-out both;animation-delay:calc(var(--i,0)*60ms)}
  .card.para{background:var(--soft)}
  .card.lit{box-shadow:0 0 0 2px var(--lime)}
  .card .ch{display:flex;justify-content:space-between;gap:12px;font:400 12px/16px var(--mono);color:var(--mute);text-transform:uppercase}
  .card .q{font-size:18px;line-height:26px;letter-spacing:-.2px}
  .card.para .q{color:var(--body)}
  .card .foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .card .foot .src{font:400 12px/16px var(--mono);color:var(--mute)}
  .card .foot a{font-size:14px;line-height:20px;letter-spacing:-.28px;cursor:pointer;color:var(--body);text-decoration:underline;text-underline-offset:3px}

  .card .note b{display:block;font:400 12px/16px var(--mono);color:var(--mute);text-transform:uppercase;margin-bottom:2px}
  .annbox{display:flex;gap:8px}
  .annbox input{flex:1;min-width:0;border:1px solid var(--hair);border-radius:8px;padding:8px 12px;font-size:14px;line-height:20px;background:var(--card);color:var(--ink);outline:none}

  #pop{position:fixed;z-index:40;max-width:560px;background:var(--card);box-shadow:var(--shadow),0 20px 40px -20px #00000040;border-radius:8px;padding:12px 16px;font-size:14px;line-height:20px;color:var(--body);display:none;white-space:pre-wrap}

  /* header: the mark on a lime disc, the wordmark, the hamburger menu (same on /, /settings, /stats) */
  .mark{width:28px;height:28px;border-radius:50%;background:var(--lime);display:inline-flex;align-items:center;justify-content:center;flex:none}
  .mark svg{width:14px;height:16px;display:block}
  .brand{font-size:20px;line-height:28px;font-weight:600;letter-spacing:-.6px;flex:none}

  .nr{font:400 12px/16px var(--mono);color:var(--red);white-space:nowrap;flex:none}
  .pm{position:relative;flex:none}
  .pm-b{width:36px;height:36px;border-radius:9px;border:0;background:var(--card);box-shadow:var(--shadow);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);padding:0}

  .pm-m{position:absolute;right:0;top:calc(100% + 8px);z-index:60;width:292px;max-width:calc(100vw - 24px);background:var(--card);border-radius:12px;box-shadow:var(--shadow),0 16px 32px -16px #00000033;padding:6px;display:flex;flex-direction:column;gap:2px}
  .pm-m[hidden]{display:none}

  .pm-id b{font-size:14px;line-height:20px;font-weight:600;letter-spacing:-.28px;color:var(--ink)}
  .pm-id span{font:400 12px/16px var(--mono);color:var(--mute)}
  .pm-m [role^=menuitem]{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;border:0;background:transparent;text-align:left;padding:8px 12px;border-radius:8px;font:400 14px/20px var(--sans);letter-spacing:-.28px;color:var(--ink);text-decoration:none;cursor:pointer}
  .pm-m [role^=menuitem]:hover{background:var(--soft)}
  .pm-m [role^=menuitem][hidden]{display:none}
  .pm-t{position:relative;width:28px;height:16px;border-radius:9999px;background:var(--hair);flex:none;transition:background .2s}
  .pm-t::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--card);box-shadow:0 1px 2px #00000026;transition:transform .2s}
  [aria-checked=true] .pm-t{background:var(--ink)}
  [aria-checked=true] .pm-t::after{transform:translateX(12px);background:var(--lime)}
  .pm-ext{font:400 11px/16px var(--mono);color:var(--mute);padding:8px 12px;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);margin:4px 0;word-break:break-word}
  .pm-ext:empty{display:none}

  .chip.ink{background:var(--ink);color:#f2f2f2;box-shadow:none}
  /* THE DECISION: a skeleton until an ask arrives, then the ask, who asked, and chips that progress */
  #rcard .dec{background:var(--lime-tint);border-radius:8px;padding:16px 20px;display:flex;flex-direction:column;gap:10px;flex:none}
  #rcard .dec .ch{display:flex;justify-content:space-between;gap:12px;font:400 12px/16px var(--mono);color:var(--body);text-transform:uppercase}
  #rcard .dec .ask{font-size:20px;line-height:28px;letter-spacing:-.4px;color:var(--ink);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  #rcard .dec .by{font:400 12px/16px var(--mono);color:var(--body)}
  #rcard .dec .ppl,#rcard .dec .st{display:flex;gap:6px;flex-wrap:wrap}
  #rcard .dec .nx{font-size:14px;line-height:20px;color:var(--body);letter-spacing:-.28px}
  #rcard .dec .nx .eyebrow{margin-right:6px}
  #rcard .dec .emp{font-size:14px;line-height:20px;color:var(--body);letter-spacing:-.28px}
  #rcard .dec .skel{display:flex;flex-direction:column;gap:10px}
  #rcard .dec.sm{gap:8px;padding:14px 18px}
  #rcard .dec.sm .ask{font-size:16px;line-height:24px;-webkit-line-clamp:2}
  #rcard .dec.sm .ppl,#rcard .dec.sm .nx{display:none}
  #rcard .dec .row2{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap}
  /* the stage is a fixed 1920x1080 frame with no scroll: the lit person's card gives the decision room */
  body.present #rcard:has(.dec.sm){gap:12px}
  body.present #rcard .dec.sm{padding:12px 18px;gap:6px}
  body.present #rcard:has(.dec.sm) .big{display:none}
  .sk{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,#e8f1bd 0%,#f9fdea 50%,#e8f1bd 100%);background-size:200% 100%;animation:shimmer 1.6s linear infinite}
  .sk.big{height:22px}
  @keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
  /* activity cards: a hover popover with the latest three, a CRM drawer on click */
  #rcard .mini .m[data-kind]{cursor:pointer;transition:box-shadow .2s}
  #rcard .mini .m[data-kind]:hover,#rcard .mini .m[data-kind]:focus-visible{box-shadow:0 0 0 1px var(--body);outline:none}
  #kpop{position:fixed;z-index:45;width:380px;max-width:calc(100vw - 16px);background:var(--card);border-radius:12px;box-shadow:var(--shadow),0 20px 40px -20px #00000040;padding:12px 14px;display:none;flex-direction:column;gap:10px;pointer-events:none}
  #kpop.on{display:flex}
  #kpop .k{font:400 12px/16px var(--mono);color:var(--mute);text-transform:uppercase}
  #kpop .r{display:flex;flex-direction:column;gap:4px;padding-top:10px;border-top:1px solid var(--hair)}
  #kpop .r .q{font-size:14px;line-height:20px;color:var(--ink);letter-spacing:-.28px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  #kpop .m2{font:400 12px/16px var(--mono);color:var(--mute)}
  #crm-scrim{position:fixed;inset:0;background:#17171733;z-index:48;display:none}
  #crm-scrim.on{display:block}
  #crm{position:fixed;top:0;right:0;bottom:0;width:min(780px,100vw);background:var(--page);box-shadow:-1px 0 0 var(--hair),-24px 0 48px -24px #00000033;z-index:49;display:flex;flex-direction:column;transform:translateX(102%);visibility:hidden;transition:transform .25s ease-out,visibility .25s}
  #crm.on{transform:none;visibility:visible}
  #crm .ch{display:flex;align-items:center;gap:12px;padding:20px 24px 12px}
  #crm .ch h2{font-size:20px;line-height:28px;font-weight:600;letter-spacing:-.6px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #crm .flt{display:flex;gap:8px;padding:0 24px 12px}
  #crm .flt input,#crm .flt select{border:1px solid var(--hair);border-radius:8px;padding:8px 12px;font-size:14px;line-height:20px;background:var(--card);color:var(--ink);outline:none;min-width:0}
  #crm .flt input{flex:1}
  #crm .flt select{flex:0 1 200px;width:0;min-width:120px}
  #crm .flt input:focus,#crm .flt select:focus{border-color:var(--body)}
  #crm .tb{flex:1;min-height:0;overflow:auto;margin:0 24px 24px;background:var(--card);border-radius:12px;box-shadow:var(--shadow)}
  #crm table{width:100%;border-collapse:collapse;font-size:14px;line-height:20px;letter-spacing:-.28px}
  #crm th{position:sticky;top:0;background:var(--card);text-align:left;font:400 12px/16px var(--mono);color:var(--mute);text-transform:uppercase;padding:10px 12px;border-bottom:1px solid var(--hair);z-index:1}
  #crm td{padding:10px 12px;border-bottom:1px solid var(--hair);vertical-align:top;color:var(--body)}
  #crm td.dt,#crm td.wh{font:400 12px/20px var(--mono);white-space:nowrap;color:var(--mute)}
  #crm td.pp{color:var(--ink);white-space:nowrap}
  #crm td .clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  #crm td.none{color:var(--body);padding:24px 12px}
  #crm tbody tr[data-i]{cursor:pointer}
  #crm tbody tr[data-i]:hover,#crm tbody tr[data-i]:focus-visible{background:var(--soft);outline:none}
  #crm .det{display:none;flex:1;min-height:0;overflow:auto;margin:0 24px 24px;background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:20px 24px;flex-direction:column;gap:16px;align-items:flex-start}
  #crm .det.on{display:flex}
  #crm .det .full{font-size:18px;line-height:28px;letter-spacing:-.3px;color:var(--ink);white-space:pre-wrap}
  #crm .det dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:14px;line-height:20px}
  #crm .det dt{font:400 12px/20px var(--mono);color:var(--mute);text-transform:uppercase}
  #crm .det dd{margin:0;color:var(--ink);word-break:break-word}
  #crm .det dd.mono{font:400 12px/20px var(--mono)}

  /* the memo after End meeting: a modal on desktop, full screen on a phone */
  #memo-scrim{position:fixed;inset:0;background:#17171740;z-index:70;display:none;align-items:center;justify-content:center;padding:32px}
  #memo-scrim.on{display:flex}
  #memo{width:min(760px,100%);max-height:100%;background:var(--card);border-radius:12px;box-shadow:var(--shadow),0 24px 48px -24px #00000059;display:flex;flex-direction:column;animation:fadein .2s ease-out both}

  #memo .mq{font-size:20px;line-height:28px;font-weight:600;letter-spacing:-.6px}
  #memo .mb{padding:16px 24px;overflow:auto;flex:1;min-height:0;font-size:15px;line-height:22px;color:var(--body);letter-spacing:-.2px}

  #memo .mb>:first-child{margin-top:0}
  #memo .mb h1{font-size:22px;line-height:30px;letter-spacing:-.6px}
  #memo .mb h2{font-size:18px;line-height:26px;letter-spacing:-.4px}
  #memo .mb h3{font-size:16px;line-height:24px;letter-spacing:-.3px}
  #memo .mb p,#memo .mb ul,#memo .mb ol,#memo .mb blockquote{margin:0 0 10px}
  #memo .mb ul,#memo .mb ol{padding-left:20px}
  #memo .mb li{margin:2px 0}
  #memo .mb blockquote{padding:8px 12px;border-left:2px solid var(--lime-deep);background:var(--soft);border-radius:0 6px 6px 0;color:var(--ink)}
  #memo .mb strong{font-weight:600;color:var(--ink)}
  #memo .mb code{font:13px/20px var(--mono)}
  #memo .mb hr{border:0;border-top:1px solid var(--hair);margin:12px 0}
  #memo .mf{padding:12px 24px 20px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--hair)}
  body.present #memo{width:1100px}
  body.present #memo .mq{font-size:28px;line-height:36px}
  body.present #memo .mb{font-size:20px;line-height:30px}
  body.present #pm,body.present #pre,body.present #presets,body.present #join{display:none!important}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  /* fit the window: the left column never scrolls the page on a desktop; the map takes what is left */
  body:not(.present) #app{height:100vh;min-height:520px}
  body:not(.present){overflow-x:hidden}
  .right{overflow:clip;overflow-clip-margin:8px}
  body:not(.present) #rcard{min-height:0;overflow:auto}
  #wave{overflow:hidden;max-width:100%}
  #wave .bars{flex:1 1 0;min-width:0;overflow:hidden}
  #wave #wl{justify-content:flex-end}
  #wave #wr{justify-content:flex-start}
  #wave .bars i{flex:none}
  @media (max-height:820px){
    body:not(.present) #app{padding:16px 24px;gap:20px}
    body:not(.present) .left{gap:10px}
    body:not(.present) #greet{min-height:56px;gap:16px}
    body:not(.present) #greet .pikav{width:56px;height:56px}
    body:not(.present) #greet .pikav svg{width:28px;height:32px}
    body:not(.present) #greet .line{font-size:22px;line-height:28px;letter-spacing:-.66px}
    body:not(.present) #wave,body:not(.present) #wave .bars{height:40px}
    body:not(.present) #wave .wpill{padding:4px 14px;min-width:120px}
    body:not(.present) #microw .mic{width:44px;height:44px}
    body:not(.present) #microw .mic svg{width:18px;height:18px}
    body:not(.present) #askbar{height:auto}
    body:not(.present) #inbar{height:52px;padding:6px}
    body:not(.present) #inbar .pre,body:not(.present) #inbar .send{width:40px;height:40px}
    body:not(.present) #rcard{padding:20px 20px 88px;gap:12px}
  }
  @media (max-width:899px){
    body:not(.present) #app{grid-template-columns:1fr;height:auto;min-height:100vh}
    body:not(.present) #panel{flex:none;height:clamp(240px,46vh,420px)}
    body:not(.present) #rcard{height:auto;overflow:visible}
    body:not(.present) #askbar{height:auto}
  }
  @media (max-width:600px){
    body:not(.present) #app{padding:12px 16px 24px;gap:16px}
    body:not(.present) .left{gap:12px}
    body:not(.present) #greet{min-height:48px;gap:12px}
    body:not(.present) #greet .pikav{width:48px;height:48px}
    body:not(.present) #greet .pikav svg{width:24px;height:28px}
    body:not(.present) #greet .line{font-size:20px;line-height:26px;letter-spacing:-.6px}
    body:not(.present) #wave .wpill{min-width:0;padding:4px 12px}
    body:not(.present) #rcard{padding:20px 16px 88px}
    body:not(.present) #rcard .ttl .nm{font-size:26px;line-height:32px}
    body:not(.present) #microw .micline{gap:10px}
    #crm .ch,#crm .flt{padding-left:16px;padding-right:16px}
    #crm .tb,#crm .det{margin:0 12px 12px}
    #crm .wh{display:none}
    #memo-scrim{padding:0}
    #memo{width:100%;height:100%;max-height:none;border-radius:0}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="crm-scrim"></div>
<aside id="crm" role="dialog" aria-modal="true" aria-labelledby="crm-t" aria-hidden="true"><div class="ch"><h2 id="crm-t">Receipts</h2><span class="eyebrow" id="crm-n"></span><button class="act ghost" id="crm-x" type="button">Close</button></div><div class="flt"><input id="crm-q" type="search" placeholder="Search the receipts" autocomplete="off" aria-label="Search the receipts"><select id="crm-p" aria-label="Person"></select></div><div class="tb" id="crm-tb"><table><thead><tr><th>Date</th><th>Person</th><th class="wh">Where</th><th>Excerpt</th></tr></thead><tbody id="crm-body"></tbody></table></div><div class="det" id="crm-det"></div></aside>
<audio id="pikvoice" preload="auto"></audio>

<script src="/vendor/d3.min.js"></script>
<script>
// ---------- flags, state, helpers ----------
const QS=new URLSearchParams(location.search);
const F={present:QS.get('present')==='1',as:QS.get('as'),q:QS.get('q'),focus:QS.get('focus'),admin:QS.get('admin')==='1',nonum:QS.get('nonum')==='1',take:QS.get('take'),before:QS.get('before')==='1'};
const LOADED=Date.now()/1000;
const S={company:null,audit:null,cities:null,people:{},files:{},doc:[],tiles:[],draft:null,focus:null,drops:0,status:'At rest',source:null,concl:null,filed:null,docSeen:false,liveSince:0,seenRecords:new Set(),pending:null,legacyIgnore:false,droppedIds:new Set(),seenReceipts:new Set(),sessionOpen:false,speaker:null,heardText:'',said:{text:'',t:0},pikLine:null,pull:null,record:null};
const recKey=r=>`${r.id||''}|${r.person||''}|${r.source_id||''}|${r.kind||''}`;
const $=s=>document.querySelector(s);
const nd=s=>String(s==null?'':s).replace(/[\u2014\u2013]/g,'-');
const esc=s=>nd(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const normq=s=>String(s||'').toLowerCase().replace(/[\u2019]/g,"'").replace(/[\u201c\u201d]/g,'"').replace(/[^\w' ]+/g,' ').split(/\s+/).filter(Boolean).join(' ');
const words25=(t,n=25)=>{const w=String(t||'').trim().split(/\s+/);return w.length<=n?w.join(' '):w.slice(0,n).join(' ')+'...'};
const family=n=>String(n||'').trim().split(' ').pop().toLowerCase();
const first=n=>String(n||'').trim().split(' ')[0];
const initials=n=>String(n||'').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();
const NA=(what)=>`<span class="na" title="${esc(what||'')}">n/a</span>`;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const reduced=()=>window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
async function fetchJ(url,opts){try{const r=await fetch(url,opts);let d=null;try{d=await r.json()}catch(e){d=null}return {ok:r.ok,status:r.status,data:d}}catch(e){return {ok:false,status:0,data:null,err:String(e)}}}
const postJ=(url,body,method='POST')=>fetchJ(url,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});
function splitClaim(t){const m=/^(.+?): ["\u201c](.*)["\u201d]$/s.exec(String(t||''));return m?{ctx:m[1],txt:m[2]}:{ctx:'',txt:String(t||'')};}
const hash=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h};
function toast(t,ms=2600){const el=$('#toast');el.textContent=nd(t);el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('on'),ms);}
function setStatus(s){S.status=s;S.takeRunning=s!=='At rest'&&s!=='Filed'&&s!=='Concluded'?S.takeRunning:false;renderReady();const el=$('#status');el.textContent=s;el.classList.toggle('on',['Listening','Heard','Pik asks','Pik is speaking'].includes(s));el.classList.toggle('done',['Concluded','Filed'].includes(s));waveMode();}
function headerNA(t){const el=$('#hna');el.textContent=nd(t||'');el.classList.toggle('hidden',!t);}
const srcLine=s=>nd(s).replace(/, /,' \u00b7 ');
const escRe=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function highlight(text,words){ // the asked words this line covers, at 600
  let s=esc(text);(words||[]).forEach(w=>{const toks=String(w).toLowerCase().split(/\s+/).filter(Boolean).map(tok=>{let p=tok.replace(/[^\w'-]/g,'');if(p.length>=5)p=p.replace(/(ing|ies|ed|es|s)$/,'');return p.length>=3?`${escRe(p)}\\w*`:escRe(tok)});if(!toks.length)return;
    try{s=s.replace(new RegExp(`\\b${toks.join('\\s+')}`,'gi'),m=>`\u0001${m}\u0002`)}catch(e){}});
  return s.replace(/\u0001/g,'<b class="hit">').replace(/\u0002/g,'</b>');
}
// keywords the page pulls out of a heard sentence before any tool call returns (mirrors engine.py's STOP, plus talk words)
const STOP=new Set("the a an and or of to in on for with is are was be by at as it this that we our i my you your they their from not but if so than then who what which will can must best person someone somebody need want looking should own instead hold just have actually also good really anyone people think like going okay yeah right know mean thing things time week today call calls".split(' '));
function extractTerms(text){const out=[];String(text||'').toLowerCase().replace(/[^a-z\s-]+/g,' ').split(/\s+/).map(w=>w.replace(/^-+|-+$/g,'')).forEach(w=>{if(w.length>=4&&!STOP.has(w)&&!out.includes(w))out.push(w)});return out.slice(0,5)}
const NEED=/\b(need|needs|looking for|want|wants|ideal(?:ly)?|has to be|must be|should be|someone who|who (?:can|could|knows|has)|what did)\b/i;
const LIKELY=/\bhow likely|likely to|probab|chance\b/i;

// ---------- people, files (evidence), trust ----------
function personOf(id){return S.people[id]||(S.company&&(S.company.candidates||[]).find(c=>c.id===id))||null}
function nameOf(id){const p=personOf(id);return p?p.name:id}
function fixtureIndex(id){return S.company&&S.company.candidates?S.company.candidates.findIndex(c=>c.id===id):-1}
function badgeOf(id){const p=personOf(id)||{};if(p.added_by)return `added by ${nameOf(p.added_by)}${p.added_at?' \u00b7 '+String(p.added_at).slice(0,10):''}`;if(fixtureIndex(id)>=0||p.seeded)return 'seeded';if(p.generated)return 'simulated';return p.name?'simulated':''}
function labelOf(it){if(!it)return '';switch(it.source){case 'slack':return `Slack ${it.channel||''}, ${it.date||''}`;case 'wcm':return `Will Can Must sheet, ${it.date||''}`;case 'manager_notes':return `${it.manager||'manager'}'s note, ${it.date||''}`;case 'docs':return `Doc: ${String(it.title||'').replace(/,$/,'')}${it.date?', '+it.date:''}`;case 'sessions':return `AI session, opted in, ${it.date||''}`;default:return it.id||''}}
function hubLabel(it,src){if(it){if(it.source==='slack')return it.channel||'Slack';if(it.source==='wcm')return 'Will Can Must sheet';if(it.source==='manager_notes')return `${it.manager||'manager'}'s note`;if(it.source==='docs')return 'Shared doc';if(it.source==='sessions')return 'AI session';}const s=String(src||'');const m=/#[\w-]+/.exec(s);return m?m[0]:s.split(',')[0]||'source'}
async function fileOf(id,force){
  if(S.files[id]&&!force)return S.files[id];
  const f={id,items:{},claims:[],will:null,manager:null,annotations:[],err:null,backend:null,drops:0};
  if(fixtureIndex(id)>=0){
    const r=await fetchJ(`/api/evidence/${encodeURIComponent(id)}`);
    if(r.ok&&r.data&&r.data.items){
      f.items=r.data.items;Object.values(f.items).forEach(it=>{it.label=labelOf(it)});
      const ev=r.data.evidence||{};f.backend=ev.backend||null;f.drops=(ev.dropped_unsourced||0)+(ev.dropped_unfaithful||0);
      f.claims=(ev.claims||[]).filter(c=>!['declared_will','manager_paraphrase'].includes(c.kind));
      const w=Object.values(f.items).find(i=>i.source==='wcm');if(w)f.will={text:w.will,sid:w.id,item:w};
      const m=Object.values(f.items).find(i=>i.source==='manager_notes');if(m)f.manager={text:m.text,sid:m.id,item:m};
      f.annotations=r.data.annotations||[];
    }else f.err=(r.data&&r.data.error)||`evidence ${r.status||'unreachable'}`;
  }else{
    const r=await fetchJ(`/api/people/${encodeURIComponent(id)}`);
    if(r.ok&&r.data&&(r.data.receipts||r.data.id)){
      const p=r.data;S.people[id]=Object.assign(S.people[id]||{},p);
      (p.receipts||[]).forEach(rc=>{const it=Object.assign({},rc,{author:id,rendered:rc.text});it.label=labelOf(it);f.items[rc.id]=it;f.claims.push({text:rc.text,kind:'did',source_ids:[rc.id],tags:[]});});
      if(p.will){f.will={text:p.will,sid:'will-'+id,item:{id:'will-'+id,source:'wcm',date:p.added_at?String(p.added_at).slice(0,10):'',rendered:p.will,label:'Will line (self-written)'}};f.items['will-'+id]=f.will.item;}
      f.backend='record';
    }else f.err=(r.data&&r.data.error)||`people/${id} ${r.status||'unreachable'}`;
  }
  S.files[id]=f;return f;
}
// trust rule: a tile needs a source id in the person's own file; a receipt's text must sit inside the item's rendered text
async function trustTile(t){if(!t||!t.id)return false;const f=await fileOf(t.id);if(f.err)return !!t.source_id;return !!(t.source_id&&f.items[t.source_id])}
async function trustReceipt(b){const f=await fileOf(b.person);if(f.err)return false;const it=f.items[b.source_id];return !!(it&&normq(it.rendered||it.text).includes(normq(b.text)))}
function coveredIds(t){const out=[];if(t&&t.covered&&typeof t.covered==='object')Object.values(t.covered).forEach(v=>(Array.isArray(v)?v:[v]).forEach(s=>{if(s&&!out.includes(s))out.push(s)}));if(!out.length&&t&&t.source_id)out.push(t.source_id);return out}
function wordsFor(t,sid){if(!t||!t.covered||typeof t.covered!=='object')return [];return Object.entries(t.covered).filter(([w,s])=>(Array.isArray(s)?s:[s]).includes(sid)).map(([w])=>w)}
function tileOf(id){return S.tiles.find(x=>x.id===id)}
function countText(t){const asked=Array.isArray(t.asked)?t.asked:null;const cov=t.covered&&typeof t.covered==='object'?Object.keys(t.covered):null;
  if(asked&&asked.length<3)return 'too few words to count';if(!asked||!cov)return 'n/a';return `${cov.length} of ${asked.length} words have a receipt`}

// ---------- header, footer ----------
function renderHeader(){PM.audit=S.audit;pmRender()} // the never-read counter shows in the header only when the menu toggle is on
function renderFoot(){const a=S.audit;const el=$('#foot');
  const read=a&&a.used?`Read ${Object.values(a.used).reduce((n,v)=>n+(v.count||0),0)}`:`Read ${NA('audit unreachable')}`;const dm=a&&a.never_read&&a.never_read.dm?a.never_read.dm.count:null;
  const mode=S.source==='scripted'?'Scripted take':S.source==='live'?'Live call':((S.company||{}).backend==='heuristic'?'Keyword mode':(S.company&&S.company.backend?'Read by Gemini':''));
  el.innerHTML=`<span>A to Z, not a rank</span><span>Every line carries its source</span><span class="sp"></span>${S.drops?`<span class="red">${S.drops} dropped, no source</span>`:''}<span>${esc(mode)}</span>`;}

// ---------- the network over the map ----------
const M={ready:false,W:0,H:0,svg:null,g:{},proj:null,pik:{x:0,y:0},nodes:{},kw:{},hubs:{},edges:{},slots:{},pslots:{},ring:{}};
async function buildMap(){
  const box=$('#map');if(M.ready||F.as)return;M.W=box.clientWidth||1100;M.H=box.clientHeight||440;
  if(typeof d3==='undefined'){$('#mna').textContent='n/a: d3 did not load';$('#mna').classList.remove('hidden');return}
  const svg=d3.select(box).append('svg').attr('viewBox',`0 0 ${M.W} ${M.H}`).attr('preserveAspectRatio','none');M.svg=svg;
  const s=M.W/(2*Math.PI);const ty=8+72*Math.PI/180*s;
  M.proj=d3.geoEquirectangular().rotate([-150,0]).scale(s).translate([M.W/2,ty]).clipExtent([[0,0],[M.W,Math.min(M.H,ty+60*Math.PI/180*s)]]);
  M.g.land=svg.append('g');M.g.edges=svg.append('g');M.g.leaders=svg.append('g');M.g.hubs=svg.append('g');M.g.kw=svg.append('g');M.g.people=svg.append('g');M.g.pills=svg.append('g');M.g.reasons=svg.append('g');
  const land=await fetchJ('/vendor/land-110m.geo.json'); // a faint backdrop only: nothing is placed by geography
  if(land.ok&&land.data&&land.data.type)M.g.land.append('path').attr('class','land').attr('d',d3.geoPath(M.proj)(land.data));
  else{$('#mna').textContent=`n/a: /vendor/land-110m.geo.json ${land.status||'unreachable'}`;$('#mna').classList.remove('hidden')}
  M.pik={x:M.W/2,y:M.H/2};M.ring={rx1:Math.min(250,M.W*.22),ry1:Math.min(118,M.H*.22),rx2:Math.min(460,M.W*.42),ry2:Math.min(215,M.H*.4)}; // Pik in the centre; keywords on the inner ring, people on the outer
  const pg=M.g.people.append('g').attr('class','pik').attr('transform',`translate(${M.pik.x},${M.pik.y})`);pg.append('circle').attr('class','disc').attr('r',18);pg.append('g').attr('transform','translate(-9,-11) scale(.68)').append('use').attr('href','#pikmark');pg.append('text').attr('y',34).text('Pik');
  M.ready=true;
  if(S.tiles.length){addPeople(S.tiles);applyConstraints();focusMap(S.focus)}if(S.concl)concludeMap(S.concl.candidate_ids||[]);
}
function occupied(x,y,min){const all=[M.pik].concat(Object.values(M.nodes),Object.values(M.kw),Object.values(M.hubs));return all.some(n=>Math.hypot(n.x-x,n.y-y)<min)}
function pulsePik(){if(!M.ready||reduced())return;const g=M.g.people.select('.pik');const c=g.append('circle').attr('class','pulse').attr('r',18).style('opacity',.8);c.transition().duration(900).ease(d3.easeCubicOut).attr('r',64).style('opacity',0).remove();}
function slotXY(k){ // inner ring, ten fixed places 36 degrees apart from the top; a second lap sits between them, a little further out
  const lap=Math.floor(k/10),a=(-90+(k%10)*36+lap*18)*Math.PI/180,f=1+lap*.42;return {x:M.pik.x+M.ring.rx1*f*Math.cos(a),y:M.pik.y+M.ring.ry1*f*Math.sin(a)}}
function takeSlot(key){for(let k=0;k<20;k++){if(M.slots[k]&&M.slots[k]!==key)continue;M.slots[k]=key;return slotXY(k)}return {x:M.pik.x,y:M.pik.y+M.ring.ry1*1.8}}
function freeSlot(key){Object.keys(M.slots).forEach(k=>{if(M.slots[k]===key)delete M.slots[k]})}
function kwWidth(t){return Math.max(44,String(t).length*7.3+18)}
function addKeyword(word,kind){ // kind: thought (fades in 6 s) | perm | constraint
  if(!M.ready)return null;const key=String(word).toLowerCase();let n=M.kw[key];
  if(n){if(kind!=='thought'&&n.kind==='thought'){n.kind=kind;n.g.attr('class',`kw ${kind}`);clearTimeout(n.fade);n.leader&&n.leader.transition().duration(300).style('opacity',0).remove();n.leader=null;if(kind==='constraint')lockGlyph(n)}return n}
  const {x,y}=takeSlot(key);const w=kwWidth(word)+(kind==='constraint'?14:0);
  const g=M.g.kw.append('g').attr('class',`kw ${kind}`).attr('transform',`translate(${M.pik.x},${M.pik.y})`).style('opacity',0);
  g.append('rect').attr('x',-w/2).attr('y',-11).attr('width',w).attr('height',22).attr('rx',11);
  g.append('text').attr('x',kind==='constraint'?7:0).attr('y',0).attr('dy','.35em').attr('text-anchor','middle').text(word);
  n={key,word,kind,x,y,g,w};M.kw[key]=n;if(kind==='constraint')lockGlyph(n);
  const leader=M.g.leaders.append('line').attr('class','leader').attr('x1',M.pik.x).attr('y1',M.pik.y).attr('x2',M.pik.x).attr('y2',M.pik.y);n.leader=leader;
  const dur=reduced()?0:400;g.transition().duration(dur).ease(d3.easeCubicOut).attr('transform',`translate(${x},${y})`).style('opacity',null);leader.transition().duration(dur).ease(d3.easeCubicOut).attr('x2',x).attr('y2',y);
  if(kind==='thought')n.fade=setTimeout(()=>fadeKeyword(key),6000);
  return n;
}
function lockGlyph(n){n.g.selectAll('.lock').remove();n.g.append('path').attr('class','lock').attr('d','M-4 -1h8v6h-8zM-2 -1v-2a2 2 0 0 1 4 0v2').attr('fill','none').attr('stroke','#171717').attr('stroke-width',1.2).attr('transform',`translate(${-n.w/2+11},0)`)}
function fadeKeyword(key){const n=M.kw[key];if(!n||n.kind!=='thought')return;delete M.kw[key];freeSlot(key);n.g.transition().duration(400).style('opacity',0).remove();n.leader&&n.leader.transition().duration(400).style('opacity',0).remove();}
function addThoughts(text){if(!M.ready||S.concl)return;extractTerms(text).forEach((w,i)=>setTimeout(()=>{if(!M.kw[w])addKeyword(w,'thought')},60*i))}
function personXY(t){ // the outer ring: fixed places, first the right side, then the left, then top and bottom; nothing moves once placed
  const angles=[-32,32,180,-148,148,-90,90,0,-60,60,-120,120];
  for(let k=0;k<angles.length;k++){if(M.pslots[k]&&M.pslots[k]!==t.id)continue;const a=angles[k]*Math.PI/180;const x=M.pik.x+M.ring.rx2*Math.cos(a),y=M.pik.y+M.ring.ry2*Math.sin(a);if(occupied(x,y,70)&&!M.pslots[k])continue;M.pslots[k]=t.id;return {x,y}}
  return {x:M.pik.x+M.ring.rx2,y:M.pik.y+M.ring.ry2};
}
function drawEdge(id,from,to,cls){ // a dashed hairline that draws in over 500 ms; lit = lime
  if(!M.ready)return null;let e=M.edges[id];const d=`M${from.x},${from.y}L${to.x},${to.y}`;
  if(e){e.path.attr('d',d);e.from=from;e.to=to;return e}
  const path=M.g.edges.append('path').attr('class',`edge drawing ${cls||''}`).attr('d',d);const L=path.node().getTotalLength();
  e={id,path,from,to,cls:cls||''};M.edges[id]=e;
  if(reduced()){path.classed('drawing',false)}else{path.attr('stroke-dasharray',L).attr('stroke-dashoffset',L).transition().duration(500).ease(d3.easeCubicOut).attr('stroke-dashoffset',0).on('end',()=>path.attr('stroke-dasharray',null).attr('stroke-dashoffset',null).classed('drawing',false))}
  return e;
}
function removeEdge(id){const e=M.edges[id];if(!e)return;delete M.edges[id];e.path.transition().duration(300).style('opacity',0).remove()}
function addPersonNode(t){
  if(!M.ready)return null;let n=M.nodes[t.id];if(n){n.g.classed('back',t.confidence===0);return n}
  const {x,y}=personXY(t);const g=M.g.people.append('g').attr('class',`person ${t.confidence===0?'back':''}`).attr('data-id',t.id).attr('transform',`translate(${M.pik.x},${M.pik.y})`).style('opacity',0);
  g.append('circle').attr('class','disc').attr('r',20);g.append('text').attr('class','ini').attr('dy','.35em').text(initials(t.name));
  g.append('text').attr('class','nm').attr('y',36).text(t.name);g.append('text').attr('class','rl').attr('y',50).text('');
  n={id:t.id,x,y,g,name:t.name};M.nodes[t.id]=n;
  const dur=reduced()?0:500;g.transition().duration(dur).ease(d3.easeCubicOut).attr('transform',`translate(${x},${y})`).style('opacity',null);
  if(!PRESENT)g.style('cursor','pointer').on('click',()=>focusPerson(t.id,{from:'click'}));
  return n;
}
function addPeople(tiles){ // a people block: the asked words become permanent keyword nodes, each tile a person node, edges keyword -> person per covered word
  if(!M.ready)return;const asked=((tiles[0]&&Array.isArray(tiles[0].asked))?tiles[0].asked:[]).filter(w=>String(w).length>=4);
  asked.forEach((w,i)=>setTimeout(()=>addKeyword(w,'perm'),40*i));
  Object.values(M.kw).forEach(n=>{if(n.kind==='thought'&&!asked.some(w=>w.toLowerCase()===n.key))fadeKeyword(n.key)});
  tiles.forEach((t,i)=>setTimeout(()=>{const n=addPersonNode(t);if(!n)return;const cov=t.covered&&typeof t.covered==='object'?Object.keys(t.covered):[];let any=false;
    cov.filter(w=>String(w).length>=4).forEach((w,j)=>{const k=addKeyword(w,'perm');if(!k)return;any=true;setTimeout(()=>drawEdge(`kw:${k.key}>${t.id}`,k,n,''),120*j)});
    if(!any)drawEdge(`pik>${t.id}`,M.pik,n,'')},90*(i+1)));
}
function addHub(rc,t){ // a receipt: its source sits between the covered keyword(s) and the person; edges re-route through it
  if(!M.ready)return;const n=M.nodes[rc.person];if(!n)return;const f=S.files[rc.person];const it=f&&f.items[rc.source_id];const label=hubLabel(it,rc.source);const key=`${rc.person}|${label}`;if(M.hubs[key])return;
  const words=wordsFor(t,rc.source_id).map(w=>M.kw[w.toLowerCase()]).filter(Boolean);const from=words[0]||M.pik;
  const dx=n.x-from.x,dy=n.y-from.y,L=Math.hypot(dx,dy)||1;const side0=Object.keys(M.hubs).length%2?-1:1;
  const inPill=(x,y)=>Math.abs(x-n.x)<125&&y>n.y+40&&y<n.y+84; // only the lit person carries the count pill
  let hx=null,hy=null;for(const q of [.5,.36,.64,.25])for(const side of [side0,-side0]){const x=from.x+dx*q-dy/L*24*side,y=from.y+dy*q+dx/L*24*side;if(occupied(x,y,66)||inPill(x,y))continue;hx=x;hy=y;break}
  if(hx==null){hx=from.x+dx*.5-dy/L*24*side0;hy=from.y+dy*.5+dx/L*24*side0}
  const g=M.g.hubs.append('g').attr('class','hub').attr('transform',`translate(${hx},${hy})`).style('opacity',0);g.append('rect').attr('x',-6).attr('y',-6).attr('width',12).attr('height',12).attr('rx',2);
  g.append('text').attr('x',11).attr('y',0).attr('dy','.35em').attr('text-anchor','start').text(label);g.transition().duration(reduced()?0:300).style('opacity',1);
  const h={key,x:hx,y:hy,g,label};M.hubs[key]=h;

  console.log(`[say] ${id} start (${dur.toFixed(2)} s)`);setStatus('Pik is speaking');let done=false;

function buildWave(){const mk=box=>{for(let i=0;i<34;i++){const b=document.createElement('i');box.appendChild(b);WV.bars.push({el:b,i})}};mk($('#wl'));mk($('#wr'));
  const step=()=>{const t=(performance.now()-WV.t0)/1000;const now=Date.now();const speaking=WV.mode==='say';const on=speaking||WV.mode==='listen'||now<WV.pulseUntil||now<WV.saidUntil;const amp=now<WV.pulseUntil?1:(speaking||now<WV.saidUntil)?.8:(on?.45:0);

function pullShow(){const el=$('#toastp');if(!el||!S.pull)return;el.querySelector('.k').textContent=S.pull.label;el.classList.add('on');const t0=S.pull.t0;const step=()=>{if(!S.pull||S.pull.t0!==t0)return;const k=Math.min(90,Math.round((Date.now()-t0)/1500*90));el.querySelector('.p').textContent=k+'%';el.querySelector('.bar').style.width=k+'%';if(k<90)requestAnimationFrame(step)};step()}
function pullEnd(ok){const el=$('#toastp');S.pull=null;if(!el)return;if(ok){el.querySelector('.p').textContent='100%';el.querySelector('.bar').style.width='100%'}setTimeout(()=>{el.classList.remove('on');setTimeout(()=>{el.querySelector('.bar').style.width='0';el.querySelector('.p').textContent=''},350)},ok?500:0)}

// ---------- tiles: the trust rule, the coverage enrichment, then the map and the right column ----------
function tileFromAsk(row){const rc=(row.receipts||[])[0]||{};return {id:row.id,name:row.name,role:row.role,team:row.team,location:row.location,why:rc.text||(row.why||[])[0]||'',source:rc.source||'',source_id:rc.source_id||null,confidence:row.confidence,asked:row.asked,covered:row.covered,missing:row.missing,support:row.support}}
function sortAZ(ts){return ts.slice().sort((a,b)=>family(a.name).localeCompare(family(b.name))||String(a.name).localeCompare(String(b.name)))}
async function setTiles(tiles,opts={}){
  const kept=[];for(const t of tiles){if(await trustTile(t))kept.push(t);else S.drops++;}
  const need=kept.filter(t=>typeof t.confidence!=='number'&&!t.noconf);
  if(need.length&&opts.criterion){const r=await postJ('/api/ask',{question:opts.criterion,pool:kept.map(t=>t.id),k:kept.length||3,requester:requester(),surface:'page'});
    if(r.ok&&r.data&&Array.isArray(r.data.people)){r.data.people.forEach(row=>{const t=kept.find(x=>x.id===row.id);if(t){t.confidence=row.confidence;t.asked=row.asked;t.covered=row.covered;t.missing=row.missing;if(!t.why&&row.receipts&&row.receipts[0]){t.why=row.receipts[0].text;t.source=row.receipts[0].source;t.source_id=row.receipts[0].source_id}}});
      kept.forEach(t=>{if(typeof t.confidence!=='number'&&r.data.people.length&&typeof r.data.people[0].confidence==='number'){t.confidence=0}});}}
  kept.forEach(t=>{t.criterion=opts.criterion||t.criterion;t.state=(t.confidence===0)?'back':''});
  S.tiles=sortAZ(kept);renderFoot();
  if(opts.light!==false)addPeople(S.tiles);
  const lit=S.tiles.find(t=>t.confidence>0)||S.tiles[0];if(lit){S.focus=lit.id;await renderRight();setTimeout(()=>focusMap(lit.id),opts.light===false?0:400)}
}
function requester(){return (S.company&&S.company.decision&&S.company.decision.planner&&S.company.decision.planner.id)||'aya'}
async function focusPerson(id,opts={}){S.focus=id;S.record=null;await fileOf(id);await renderRight();focusMap(id);if(!F.as)recordView(id,'evaluator');}
const VIEWED={};function recordView(id,who){const k=id+'|'+who;const now=Date.now();if(VIEWED[k]&&now-VIEWED[k]<5000)return;VIEWED[k]=now;postJ('/api/view',{candidate:id,who});}

async function submitAsk(){const inp=$('#ask');if(!inp)return;const text=inp.value.trim();if(!text||text===inp.dataset.text&&S.doc.some(b=>b.type==='question'&&b.text===text))return;
  let send=text;if(S.pending&&S.pending.missing&&S.pending.missing.length)send=S.pending.text+' '+text;
  await applyEvent({t:Date.now()/1000,kind:'heard',text,local:true});
  const r=await postJ('/api/chat',{text:send,requester:requester()});
  if(!r.ok||!r.data||!r.data.intent){if(r.status===404||r.status===0)return runAsk(text,{note:`n/a: /api/chat ${r.status||'unreachable'}, plain ask`});toast('n/a: '+((r.data&&r.data.error)||`chat ${r.status}`));pullEnd(false);return}
  const d=r.data;
  if(d.intent==='ask'){S.pending=null;S.draft=null;renderDraft();return runAsk(text,{payload:d.ask})}
  pullEnd(false);S.pending={text:send,intent:d.intent,missing:d.missing||[]};
  S.draft=(d.draft&&d.draft.name)||d.intent!=='add'?{intent:d.intent,draft:d.draft||{},missing:d.missing||[],backend:d.backend||'rules',ambiguous:d.ambiguous||[],target:(d.target&&d.target.id)||(typeof d.target==='string'?d.target:null)||d.id||null,changes:d.changes||d.patch||(Array.isArray(d.changed)&&d.draft?Object.fromEntries(d.changed.filter(k=>k in d.draft).map(k=>[k,d.draft[k]])):null),confirmText:d.confirm||null}:null;

  if(d.question||(d.missing&&d.missing.length)||(d.ambiguous&&d.ambiguous.length)){S.doc.push({type:'ask',id:'crud-ask',text:d.question||`Which ${(d.missing||[])[0]||'team'} is ${first((d.draft||{}).name||'this person')} on?`});setStatus('Pik asks');}
  inp.value='';inp.dataset.text='';renderInput();renderDraft();
}
async function runAsk(text,opts={}){ // a typed ask renders through the same path as the listener: heard, then a composed [question, people] document
  if(!S.doc.some(b=>b.type==='question'&&b.text===text))await applyEvent({t:Date.now()/1000,kind:'heard',text,local:true});
  let payload=opts.payload;if(!payload){const r=await postJ('/api/ask',{question:text,requester:requester(),surface:'page'});if(!r.ok||!r.data){toast('n/a: '+((r.data&&r.data.error)||`ask ${r.status||'unreachable'}`));pullEnd(false);return}payload=r.data}
  if(opts.note)headerNA(opts.note);
  const rows=(payload.people||[]).map(tileFromAsk).filter(t=>t.source_id);const doc=[{type:'question',id:'q-local',text}];
  if(rows.length)doc.push({type:'people',id:'p-local',criterion:text,tiles:rows});
  if(payload.follow_up&&(!rows.length||(Array.isArray(payload.people[0]&&payload.people[0].asked)&&payload.people[0].asked.length<3)))doc.push({type:'ask',id:'fu-local',text:payload.follow_up});
  await applyEvent({t:Date.now()/1000,kind:'compose',doc,local:true});S.doc.heardEyebrow='Asked';
  const inp=$('#ask');if(inp&&document.activeElement===inp)inp.blur();
  if(rows.length&&F.focus&&rows.some(r=>r.id===F.focus))focusPerson(F.focus,{from:'ask'});
}
async function confirmDraft(){if(confirmDraft.busy)return;const d=S.draft;if(!d)return;const p=d.draft||{};let r;confirmDraft.busy=true;const cb=$('#confirm');if(cb)cb.disabled=true;try{

    if(r.ok&&r.data&&r.data.ok){const was=personOf(id)||{};S.draft=null;S.pending=null;S.doc=S.doc.filter(b=>b.id!=='crud-ask');S.seenRecords.add('remove:'+id);renderDraft();applyEvent({t:Date.now()/1000,kind:'record',op:'remove',person:Object.assign({id,location:was.location,team:was.team},r.data.removed||{}),by:requester(),local:true});return}

// ---------- the one renderer over both sources ----------
function resetSession(){try{const v=$('#pikvoice');if(v){v.pause()}}catch(e){}S.doc=[];S.dec=null;S.tiles=[];S.draft=null;S.concl=null;S.filed=null;S.drops=0;S.docSeen=false;S.focus=null;S.record=null;S.speaker=null;S.pikLine=null;S.droppedIds=new Set();S.seenReceipts=new Set();pullEnd(false);mapReset();$('#concl').className='over lime';$('#concl').innerHTML='';renderDraft();renderInput();renderGreeting();renderRight();renderFoot();}

    if(isEnd){document.body.classList.remove('meeting');if(!S.docSeen&&!S.tiles.length){setStatus('At rest');S.source=null;}else if(S.status==='Listening'||S.status==='Heard'||S.status==='Pik asks'){setStatus(S.filed?'Filed':S.concl?'Concluded':'Heard')}}
    renderFoot();return}
  if(k==='heard'){if(F.as)return;setStatus('Heard');document.body.classList.add('meeting');S.speaker=null;S.heardText=e.text||'';
    if(!S.doc.some(b=>b.type==='question')){S.doc.push({type:'question',id:'heard',text:e.text||'',instant});S.doc.heardEyebrow='Heard'}
    else{const q=S.doc.find(b=>b.type==='question');q.text=e.text||q.text;q.instant=instant} // the field always shows the last heard line
    if(e.who)S.speaker={who:String(e.who),text:String(e.text||'')};
    if(e.local||looksLikeAsk(e.text))setDecision(e.text,{t:e.t,local:e.local});
    renderInput();if(!instant){wavePulse(1500);addThoughts(e.text);if(NEED.test(e.text||'')||e.local)pullStart(LIKELY.test(e.text||'')?'Factors, from receipts':'Pulling receipts...')}return}
  if(k==='speaker'){if(F.as)return;const q=S.doc.find(b=>b.type==='question');const txt=String(e.text||'');const cur=q?String(q.text||''):S.heardText;
    if(e.who&&txt&&(cur===txt||cur.startsWith(txt))){S.speaker={who:String(e.who),text:cur};renderInput();if(S.dec&&!S.dec.local&&(S.dec.text===nd(cur)||S.dec.text.startsWith(nd(txt)))){S.dec.who=String(e.who);renderDecision()}}return}

  if(k==='said'){if(F.as)return;const t=String(e.text||'');if(!t.trim()||/<no speech detected>/i.test(t))return;const now=Date.now();
    S.said.text=(now-S.said.t<2500?S.said.text:'')+t;S.said.t=now;if(!instant){waveSaid(1500);const keys=(S.tiles[0]&&S.tiles[0].asked)||[];setPikLine(S.said.text.trim(),keys)}return}
  if(k==='compose'||k==='patch'){if(F.as)return;
    const doc=Array.isArray(e.doc)?e.doc:null;if(doc)S.doc=doc.slice();else if(e.block){const b=e.block;S.doc=S.doc.filter(x=>x.id!==b.id&&!(['question','people','ask'].includes(b.type)&&x.type===b.type));if(e.op!=='remove')S.doc.push(b)}
    S.docSeen=true;S.legacyIgnore=true;{const q0=S.doc.find(b=>b.type==='question');if(q0&&String(q0.text||'').trim())setDecision(q0.text,{t:e.t,local:e.local})}
    let recs=S.doc.filter(b=>b.type==='receipt');for(const r of recs){const rk=recKey(r);if(S.droppedIds.has(rk)){S.doc=S.doc.filter(x=>x!==r);continue}if(!(await trustReceipt(r))){S.doc=S.doc.filter(x=>x!==r);S.droppedIds.add(rk);S.drops++}}recs=S.doc.filter(b=>b.type==='receipt');

    renderInput();

    if(people){const tiles=(people.tiles||[]).map(t=>Object.assign({},t));const same=S.tiles.length===tiles.length&&tiles.every(t=>S.tiles.some(x=>x.id===t.id))&&S.tiles[0]&&S.tiles[0].criterion===people.criterion;
      if(!same){await setTiles(tiles,{criterion:people.criterion,light:!instant});pullEnd(true)}else{tiles.forEach(t=>{const x=S.tiles.find(y=>y.id===t.id);if(x&&typeof t.confidence==='number')Object.assign(x,{confidence:t.confidence,asked:t.asked,covered:t.covered,missing:t.missing})});}}

  if(!mode){el.className='';el.innerHTML='';el.removeAttribute('role');return}
  el.className=mode;if(mode==='list')el.setAttribute('role','menu');else el.removeAttribute('role');
  el.innerHTML=(mode==='list'?'<div class="k">Try an ask</div>':'')+PRESETS.map((p,i)=>`<button type="button" data-p="${i}"${mode==='list'?' role="menuitem"':''}>${esc(p)}</button>`).join('')}
async function usePreset(i){const t=PRESETS[i];if(!t)return;presetsShow(null);const inp=$('#ask');inp.value=t;inp.dataset.text='';await submitAsk()}

// ---------- activity cards: the latest three on hover (GET /api/source/<kind>?limit=3), every receipt in a CRM drawer on click ----------
const KINDS={slack:{label:'Slack',api:'slack'},docs:{label:'Docs',api:'docs'},wcm:{label:'Sheets',api:'sheets'},sessions:{label:'Sessions',api:'sessions'}};
const KP={cache:{},anchor:null,quiet:0};
function rowOf(r){r=r||{};const pid=r.person_id||r.author||r.person||'';return {quote:nd(r.quote||r.excerpt||r.text||r.rendered||r.will||r.problem||''),person:nd(r.person_name||r.author_name||(typeof r.person==='string'&&r.person!==pid?r.person:'')||(pid?nameOf(pid):'')),pid,where:nd(r.where||r.channel||r.title||r.doc||r.sheet||r.label||''),date:nd(r.date||r.at||''),sid:nd(r.source_id||r.id||''),url:r.original_url||'',full:nd(r.full_text||r.text||r.rendered||r.quote||r.excerpt||'')}}
function rowsOf(d){const a=(Array.isArray(d)?d:(d&&(d.receipts||d.items||d.rows||d.results)))||[];return a.map(rowOf)}
async function kindRows(kind,limit,pid){const k=KINDS[kind];if(!k)return {ok:false,err:'unknown source '+kind};const key=kind+':'+limit+':'+(pid||'');if(KP.cache[key])return KP.cache[key];
  const r=await fetchJ(`/api/source/${k.api}?limit=${limit}${pid?`&person=${encodeURIComponent(pid)}`:''}`);
  const v=r.ok&&r.data?{ok:true,rows:rowsOf(r.data),count:(r.data.count!=null?r.data.count:r.data.total!=null?r.data.total:null)}:{ok:false,err:nd((r.data&&r.data.error)||`/api/source/${k.api} ${r.status||'unreachable'}`)};
  if(v.ok)KP.cache[key]=v;return v}
function placeKPop(card){const el=$('#kpop');el.classList.add('on');const r=card.getBoundingClientRect();const w=el.offsetWidth,h=el.offsetHeight;
  const x=Math.max(8,Math.min(r.left+r.width/2-w/2,innerWidth-w-8));let y=r.top-h-8;if(y<8)y=Math.min(innerHeight-h-8,r.bottom+8);el.style.left=Math.round(x)+'px';el.style.top=Math.round(Math.max(8,y))+'px'}
async function showKindPop(card){if(F.as||Date.now()<KP.quiet||$('#crm').classList.contains('on'))return;const kind=card.dataset.kind;if(!KINDS[kind])return;KP.anchor=card;const el=$('#kpop');const pid=S.focus&&!S.record?S.focus:'';const head=`<div class="k">${esc(KINDS[kind].label)} · latest${pid?` from ${esc(first(nameOf(pid)))}`:' receipts'}</div>`;
  el.innerHTML=head+`<div class="r"><span class="sk" style="width:80%"></span><span class="sk" style="width:50%"></span></div>`;placeKPop(card);
  const own=pid?fileRows(pid,kind):null;const v=own?{ok:true,rows:own}:await kindRows(kind,3,pid);if(KP.anchor!==card)return;
  el.innerHTML=head+(v.ok?(v.rows.length?v.rows.slice(0,3).map(x=>`<div class="r"><div class="q">"${esc(x.quote)}"</div><div class="m2">${esc([x.person,x.where,x.date].filter(Boolean).join(' · '))}</div></div>`).join(''):`<div class="r"><div class="m2">No receipts from this source yet.</div></div>`):`<div class="r"><span class="na">n/a: ${esc(v.err)}</span></div>`)+`<div class="m2">Click for every receipt</div>`;placeKPop(card)}
function fileRows(pid,kind){ // the lit person's card counts their own file: its latest three come from the same file
  const f=S.files[pid];if(!f||!f.items||f.err)return null;return Object.values(f.items).filter(it=>it.source===kind).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))).map(it=>({quote:nd(itemWords(it)),person:nd(nameOf(it.author||pid)),where:nd(it.source==='docs'?(it.title||'Shared doc'):hubLabel(it,'')),date:nd(it.date||''),sid:it.id}))}
function hideKindPop(){KP.anchor=null;const el=$('#kpop');if(el)el.classList.remove('on')}
const CRM={kind:null,rows:[],count:0,q:'',person:'',sel:null};
async function openCRM(kind){if(F.as||!KINDS[kind])return;hideKindPop();CRM.kind=kind;CRM.q='';CRM.sel=null;CRM.rows=[];CRM.pid=S.focus&&!S.record?S.focus:'';CRM.person='';
  $('#crm-t').textContent=`${KINDS[kind].label} · loading`;$('#crm-n').textContent='';$('#crm-q').value='';$('#crm-p').innerHTML='';$('#crm-body').innerHTML='';$('#crm-det').classList.remove('on');$('#crm-det').innerHTML='';$('#crm-tb').classList.remove('hidden');
  $('#crm').classList.add('on');$('#crm').setAttribute('aria-hidden','false');$('#crm-scrim').classList.add('on');setTimeout(()=>$('#crm-q').focus(),60);
  const v=await kindRows(kind,500);if(CRM.kind!==kind)return;
  if(!v.ok){$('#crm-t').textContent=`${KINDS[kind].label} · n/a`;$('#crm-body').innerHTML=`<tr><td colspan="4" class="none"><span class="na">n/a: ${esc(v.err)}</span></td></tr>`;return}
  CRM.rows=v.rows.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));CRM.count=v.count!=null?v.count:v.rows.length;
  const ppl=[...new Set(CRM.rows.map(r=>r.person).filter(Boolean))].sort((a,b)=>family(a).localeCompare(family(b)));const lit=CRM.pid&&CRM.rows.find(r=>r.pid===CRM.pid);CRM.person=lit?lit.person:'';
  $('#crm-p').innerHTML=`<option value="">Everyone (${ppl.length})</option>`+ppl.map(p=>`<option value="${esc(p)}"${p===CRM.person?' selected':''}>${esc(p)}</option>`).join('');renderCRM()}
function renderCRM(){const q=normq(CRM.q);const rows=CRM.rows.map((r,i)=>[r,i]).filter(([r])=>(!CRM.person||r.person===CRM.person)&&(!q||normq([r.quote,r.full,r.person,r.where,r.date,r.sid].join(' ')).includes(q)));
  $('#crm-t').textContent=`${KINDS[CRM.kind].label} · ${CRM.count} receipt${CRM.count===1?'':'s'}`;$('#crm-n').textContent=rows.length===CRM.rows.length?'':`${rows.length} shown`;
  $('#crm-body').innerHTML=rows.length?rows.map(([r,i])=>`<tr tabindex="0" data-i="${i}"><td class="dt">${esc(r.date)}</td><td class="pp">${esc(r.person)}</td><td class="wh">${esc(r.where)}</td><td class="ex"><div class="clamp">${esc(r.quote)}</div></td></tr>`).join(''):`<tr><td colspan="4" class="none">${CRM.rows.length?'No receipts match.':'No receipts from this source yet.'}</td></tr>`}
function openRow(i){const r=CRM.rows[i];if(!r)return;CRM.sel=i;const d=$('#crm-det');
  d.innerHTML=`<button class="act ghost" id="crm-back" type="button">Back to the list</button><div class="full">"${esc(r.full||r.quote)}"</div><dl><dt>Person</dt><dd>${esc(r.person||'n/a')}</dd><dt>Where</dt><dd>${esc(r.where||'n/a')}</dd><dt>Date</dt><dd>${esc(r.date||'n/a')}</dd><dt>Source id</dt><dd class="mono">${esc(r.sid||'n/a')}</dd></dl>${r.url?`<button class="act" id="crm-orig" type="button">Open the original</button><div class="orig hidden" id="crm-origbox"></div>`:''}`;
  $('#crm-tb').classList.add('hidden');d.classList.add('on');$('#crm-back').addEventListener('click',closeRow);$('#crm-back').focus();
  const ob=$('#crm-orig');if(ob)ob.addEventListener('click',()=>openOriginal(r))}
async function openOriginal(r){const box=$('#crm-origbox');if(!box)return;box.classList.remove('hidden');box.textContent='Opening the original...'; // original_url is a route the page reads in place: GET /api/evidence/<file>, items[<id>]
  const x=await fetchJ(r.url);const it=x.ok&&x.data&&x.data.items&&x.data.items[r.sid];if(!$('#crm-origbox'))return;
  if(it){box.innerHTML=`<span class="eyebrow">${esc(labelOf(it)||it.id||r.sid)}</span>\n${esc(it.rendered||itemWords(it)||it.text||'')}`}else box.innerHTML=`<span class="na">n/a: ${esc(r.sid)} not in ${esc(r.url)} (${x.status||'unreachable'})</span>`}
function closeRow(){$('#crm-det').classList.remove('on');$('#crm-tb').classList.remove('hidden');const tr=document.querySelector(`#crm-body tr[data-i="${CRM.sel}"]`);CRM.sel=null;if(tr)tr.focus()}
function closeCRM(){if(!$('#crm').classList.contains('on'))return;const kind=CRM.kind;$('#crm').classList.remove('on');$('#crm').setAttribute('aria-hidden','true');$('#crm-scrim').classList.remove('on');CRM.kind=null;KP.quiet=Date.now()+400;
  const c=document.querySelector(`#rcard .m[data-kind="${kind}"]`);if(c)c.focus()}

function wireControls(){const inp=$('#ask');
  $('#mic').addEventListener('click',()=>setListen(!(LS.on&&!LS.unsupported)));
  $('#endb').addEventListener('click',endMeeting);
  $('#j-meet').addEventListener('click',async e=>{const a=e.currentTarget;if(!a.getAttribute('href')){e.preventDefault();toast(a.title||'No Meet link yet',3200);return}
    if(!(LS.on&&!LS.unsupported)){const ok=await setListen(true);if(!ok)return}toast('Share this tab in the call. Pik is listening.',4200)});
  ['#j-slack','#j-board'].forEach(s=>$(s).addEventListener('click',e=>{if(!e.currentTarget.getAttribute('href')){e.preventDefault();toast(e.currentTarget.title,3200)}}));
  $('#memo-close').addEventListener('click',closeMemo);$('#memo-copy').addEventListener('click',copyMemo);$('#memo-scrim').addEventListener('click',e=>{if(e.target.id==='memo-scrim')closeMemo()});
  $('#pre').addEventListener('click',e=>{e.stopPropagation();const open=PRE_MODE!=='list';presetsShow(open?'list':null);if(open&&e.detail===0){const f=$('#presets button');if(f)f.focus()}});
  $('#presets').addEventListener('pointerdown',e=>{if(e.target.closest('button'))e.preventDefault()});
  $('#presets').addEventListener('click',e=>{const b=e.target.closest('button[data-p]');if(b){e.stopPropagation();usePreset(Number(b.dataset.p))}});
  $('#presets').addEventListener('keydown',e=>{if(e.key!=='ArrowDown'&&e.key!=='ArrowUp')return;const its=[...$('#presets').querySelectorAll('button')];if(!its.length)return;const i=its.indexOf(document.activeElement);e.preventDefault();its[e.key==='ArrowDown'?(i+1)%its.length:(i-1+its.length)%its.length].focus()});
  inp.addEventListener('focus',()=>{if(!inp.value.trim()&&PRE_MODE!=='list')presetsShow('chips')});
  inp.addEventListener('input',()=>{if(inp.value.trim()){if(PRE_MODE==='chips')presetsShow(null)}else if(!PRE_MODE)presetsShow('chips')});
  inp.addEventListener('blur',()=>setTimeout(()=>{if(PRE_MODE==='chips'&&document.activeElement!==inp&&!$('#presets').contains(document.activeElement))presetsShow(null)},150));
  document.addEventListener('click',e=>{if(PRE_MODE==='list'&&!e.target.closest('#presets,#pre'))presetsShow(null)});
  let hov=null;
  document.addEventListener('mouseover',e=>{const c=e.target.closest&&e.target.closest('#rcard .m[data-kind]');if(!c||c===KP.anchor)return;clearTimeout(hov);hov=setTimeout(()=>showKindPop(c),120)});
  document.addEventListener('mouseout',e=>{const c=e.target.closest&&e.target.closest('#rcard .m[data-kind]');if(!c||(e.relatedTarget&&c.contains(e.relatedTarget)))return;clearTimeout(hov);if(document.activeElement!==c)hideKindPop()});
  document.addEventListener('focusin',e=>{const c=e.target.closest&&e.target.closest('#rcard .m[data-kind]');if(c)showKindPop(c)});
  document.addEventListener('focusout',e=>{const c=e.target.closest&&e.target.closest('#rcard .m[data-kind]');if(c)hideKindPop()});
  document.addEventListener('click',e=>{const c=e.target.closest('#rcard .m[data-kind]');if(c)openCRM(c.dataset.kind)});
  document.addEventListener('keydown',e=>{const c=e.target.closest&&e.target.closest('#rcard .m[data-kind]');if(c&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.stopImmediatePropagation();openCRM(c.dataset.kind)}},true);
  $('#crm-x').addEventListener('click',closeCRM);$('#crm-scrim').addEventListener('click',closeCRM);
  $('#crm-q').addEventListener('input',e=>{CRM.q=e.target.value;renderCRM()});$('#crm-p').addEventListener('change',e=>{CRM.person=e.target.value;renderCRM()});
  $('#crm-body').addEventListener('click',e=>{const tr=e.target.closest('tr[data-i]');if(tr)openRow(Number(tr.dataset.i))});
  $('#crm-body').addEventListener('keydown',e=>{const tr=e.target.closest('tr[data-i]');if(tr&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openRow(Number(tr.dataset.i))}});
  document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;presetsShow(null);hideKindPop();if($('#memo-scrim').classList.contains('on')){closeMemo();return}closeCRM()});
}
// ---------- init ----------
const PRESENT=F.present&&!F.as;
function fitStage(){if(!PRESENT)return;const s=Math.min(innerWidth/1920,innerHeight/1080);const st=$('#stage');st.style.transform=`translate(${Math.round((innerWidth-1920*s)/2)}px,${Math.round((innerHeight-1080*s)/2)}px) scale(${s})`;} // the whole 1920x1080 stage, scaled to the window, centred
addEventListener('resize',fitStage);
async function init(){fitStage();
  if(F.present)document.body.classList.add('present');if(F.admin)document.body.classList.add('admin');
  if(F.as){document.body.classList.add('subjectonly');$('#app').classList.add('hidden');$('#subject').classList.remove('hidden');}
  if(F.take){S.source='scripted';const rr=await postJ('/api/reset',{people:true});if(!rr.ok)headerNA(`n/a: /api/reset ${rr.status||'unreachable'}`);}
  if(F.take==='crud')addEventListener('pagehide',()=>{try{navigator.sendBeacon&&navigator.sendBeacon('/api/reset',new Blob([JSON.stringify({people:true})],{type:'text/plain'}))}catch(e){}});
  const [co,au]=await Promise.all([fetchJ(F.as?`/api/company?view=subject&cid=${encodeURIComponent(F.as)}`:'/api/company'),fetchJ('/api/audit')]);
  if(co.ok&&co.data&&!co.data.error)S.company=co.data;else if(F.as){const c2=await fetchJ('/api/company');if(c2.ok&&c2.data){S.company=Object.assign({},c2.data,{candidates:[]})}}
  if(!S.company)S.company={name:'',decision:{},candidates:[],backend:null};
  if(au.ok&&au.data)S.audit=au.data;
  (S.company.candidates||[]).forEach(c=>{S.people[c.id]=Object.assign(S.people[c.id]||{},c,{seeded:true,generated:false})});
  const pl=S.company.decision&&S.company.decision.planner;if(pl&&pl.id)S.people[pl.id]=Object.assign(S.people[pl.id]||{},pl,{planner:true});
  if(F.as){const own=await fetchJ(`/api/people/${encodeURIComponent(F.as)}`);if(own.ok&&own.data&&own.data.id)S.people[F.as]=Object.assign(S.people[F.as]||{},own.data);await fileOf(F.as);await renderSubject();mountSubjectHeader();pmMount();renderSession();return}
  pmMount();renderHeader();renderFoot();renderGreeting();buildWave();waveMode();renderInput();if(PRESENT)loadVoice();renderSession();wireControls();pollSurfaces();setInterval(pollSurfaces,5000);
  const inp=$('#ask');inp.addEventListener('keydown',e=>{if(e.key==='Enter')submitAsk()});$('#go').addEventListener('click',submitAsk);
  await buildMap();await renderRight();
  if(!F.take)await primeLive();else S.liveSince=LOADED;
  if(F.q){inp.value=F.q;await runAsk(F.q)}
  pollLive();runTake();
}
init();
